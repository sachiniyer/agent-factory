name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_docs:
        # Tri-state on purpose. 'auto' means "decide the same way a push would",
        # by diffing this commit's own paths below — which is what the auto-gate
        # merge dispatch uses (#3435), because a GITHUB_TOKEN push suppresses the
        # push trigger and something has to re-raise this run. The caller passing
        # nothing therefore gets the push behaviour rather than a second copy of
        # the path list living in the caller, where it had already drifted.
        # 'true'/'false' stay available for a manual deploy or a dry run.
        description: 'Deploy docs: auto (same rule as a push), or force true/false'
        required: false
        default: auto
        type: choice
        options: [auto, 'true', 'false']
      verify_sha:
        # The commit whose paths 'auto' should examine. A dispatch cannot name a
        # commit — workflow_dispatch takes a branch ref — so a run raised for
        # merge A can start after merge B has already advanced master. Verifying
        # the newer tree is fine for a BUILD, which is monotonic. Publishing is
        # not: diffing B's paths would report no docs change and A's docs would
        # never publish, so the deploy decision is pinned to the commit that
        # raised the run. Empty means "this commit", which is the push behaviour.
        description: 'Commit whose paths decide the deploy (default: this commit)'
        required: false
        default: ''
        type: string

# GITHUB_TOKEN defaults to read-only; the deploy job needs to publish the Pages
# artifact and mint the OIDC token actions/deploy-pages exchanges.
permissions:
  contents: read

jobs:
  # Runs on every push and PR: prove the autogenerated reference pages are in
  # sync with the code, then build the site with --strict so any broken link or
  # bad reference fails the check.
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.docs_changes.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check docs deploy paths
        id: docs_changes
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        shell: bash
        # Every ${{ }} value reaches the script through the environment, never by
        # substitution into the program text. verify_sha is a free-form input, so
        # substituting it would let anyone who can dispatch this workflow run
        # `$(…)` in the build workspace — before upload-pages-artifact, on a run
        # that can publish Pages.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_DOCS: ${{ inputs.deploy_docs }}
          VERIFY_SHA: ${{ inputs.verify_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          # …and it is validated as well as quoted: belt and braces, because the
          # value also reaches `git`, and a full commit SHA is the only thing it
          # is ever meant to be.
          if [[ -n "$VERIFY_SHA" && ! "$VERIFY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::verify_sha must be a full 40-character commit SHA"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DEPLOY_DOCS" != "auto" ]]; then
            echo "docs_changed=$DEPLOY_DOCS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 'auto' and push share this path. On a dispatch there is no
          # github.event.before, so the diff below falls to `git diff-tree` on
          # the commit itself — the merge commit's own change set, which is
          # exactly what the suppressed push run would have examined.
          before="$EVENT_BEFORE"
          after="${VERIFY_SHA:-$EVENT_SHA}"

          # An explicitly named commit is always diffed on its own, never against
          # a `before` that belongs to a different event.
          if [[ -n "$VERIFY_SHA" || -z "$before" || "$before" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$after")"
          else
            changed="$(git diff --name-only "$before" "$after")"
          fi

          docs_changed=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|mkdocs.yml|README.md|commands/docs_gen.go|requirements-docs.txt|scripts/gen-docs.sh)
                docs_changed=true
                break
                ;;
            esac
          done <<< "$changed"

          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # The drift gate for every generated artifact: the docs reference pages
      # and the per-agent plugins (#2172). `git status --porcelain` rather than
      # `git diff` on purpose — a generated file the author forgot to `git add`
      # is untracked, which `git diff` does not see at all.
      - name: Regenerate autogen artifacts and check for drift
        run: |
          generated=(docs/reference plugins .agents .claude-plugin)
          scripts/gen-docs.sh
          if [[ -n "$(git status --porcelain -- "${generated[@]}")" ]]; then
            echo "::error::Generated files are stale. Run scripts/gen-docs.sh and commit the result."
            git --no-pager status --porcelain -- "${generated[@]}"
            git --no-pager diff -- "${generated[@]}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs toolchain
        run: pip install -r requirements-docs.txt

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: steps.docs_changes.outputs.docs_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the artifact to GitHub Pages. Only on master, only when docs paths
  # changed, only after build+verify passes. Pages source must be set to
  # "GitHub Actions" (Settings → Pages → Build and deployment → Source).
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master' && needs.build.outputs.docs_changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Back off before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Back off before final Pages deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 30

      - name: Final GitHub Pages deploy retry
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/deploy-pages@v4
