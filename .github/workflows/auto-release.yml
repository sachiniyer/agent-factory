name: Auto Preview Release

# Cuts a preview release (vX.Y.Z-preview-N, GitHub prerelease) off master
# every 3 hours when there are new commits. Stable releases are cut manually
# via stable-release.yml. See docs/dev/release-process.md (#1041).
#
# Atomicity rule (#5159): a version tag exists on origin only if its release
# was published. The check job computes the version without pushing anything;
# every job pins github.sha; the tag is created by `gh release create
# --target` inside the publish call itself — after the build matrix has
# succeeded — so a failed or cancelled run can leave a draft at worst, never
# a tag with no release. "Latest tag" means latest tag with a published
# release everywhere below, so one stranded tag can never wedge future runs.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# One run at a time, never cancelled: two concurrent runs can compute the same
# version, and cancelling mid-publish is exactly how drafts and tags get
# stranded (#5159). Queued runs coalesce — the pending one releases the newest
# master anyway.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    name: Check for changes and compute version
    # Pinned to 24.04 until #6281 (26.04 compatibility) lands.
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      new_version: ${{ steps.compute.outputs.new_version }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    # Release state, not tag state, decides what "latest" means: a tag pushed
    # without its release (a cancelled run under the pre-#5159 scheme, or any
    # future stranding) shipped no binaries and must not be the baseline.
    # Drafts are excluded — they carry a tag_name but no ref and no binaries.
    - name: List tags with a published release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --paginate --jq '.[] | select(.draft == false) | .tag_name' \
          > "$RUNNER_TEMP/released-tags.txt"
        echo "$(wc -l < "$RUNNER_TEMP/released-tags.txt") published releases"

    - name: Check for new commits since last released tag
      id: check
      run: |
        LATEST_TAG=$(.github/scripts/latest-released-tag.sh "$RUNNER_TEMP/released-tags.txt")
        if [ -z "$LATEST_TAG" ]; then
          echo "No released tags found, should release"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        else
          COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          if [ "$COMMITS_SINCE" -gt 0 ]; then
            echo "Found $COMMITS_SINCE new commits since $LATEST_TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since $LATEST_TAG"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
        fi

    # The preflight runs the full suite, and internal/shellsuggest FAILS rather
    # than skips when a shell it claims (sh/bash/zsh) is absent (#1978/#1988).
    # Without zsh the preflight cannot pass, so a release would be unable to cut.
    # Routed through scripts/ci-apt-install.sh so a third-party source in the
    # runner image cannot fail this step by failing the update (#3774) — a
    # release must not be blocked by a repository it never installs from.
    - name: Install zsh
      if: steps.check.outputs.should_release == 'true'
      run: scripts/ci-apt-install.sh zsh

    # Test (macOS) is the only darwin test run and lives on master's pr.yml, which
    # the preflight below cannot see. Block on a known-red verdict (#5818).
    - name: Test (macOS) verdict on master
      if: steps.check.outputs.should_release == 'true'
      uses: actions/github-script@v8
      with:
        script: |
          await require('./.github/scripts/macos-verdict.js').gateRelease({ github, core, context });

    - name: Release preflight
      if: steps.check.outputs.should_release == 'true'
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::Unformatted files found:"
          echo "$unformatted"
          gofmt -d .
          exit 1
        fi
        go vet ./...
        # The same explicit budget as stable-release.yml's preflight (#4463). This
        # lane runs the identical -race suite every three hours, and #4463 left it
        # on Go's 10m per-package default: daemon measured 500.0s here on
        # 2026-09-16, 83% of that default, on the curve that failed v1.0.288 (#4464).
        # The five successful runs before v1.0.290 took 494s, 500s, 481s, 504s and
        # 594.5s, the last 5.5s from failing a preview release on a budget (#4556).
        go test -v -race -count=1 -timeout=30m ./...
        go build ./...

    # Only released tags feed the computation: a stranded tag must not bump the
    # preview counter either (#5159). Nothing is tagged or pushed in this job —
    # the tag is created by the release itself in the release job.
    - name: Compute preview version
      id: compute
      if: steps.check.outputs.should_release == 'true'
      run: |
        NEW_VERSION=$(.github/scripts/next-preview-version.sh < "$RUNNER_TEMP/released-tags.txt")
        echo "New preview version: $NEW_VERSION"
        echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  # web/dist is committed (web/embed.go embeds it) but, once WEB_DIST_SYNC is on, PRs no
  # longer carry it: web-dist-sync.yml lands it after the source (#6447). A tag must never
  # embed a bundle that lags web/src, so rebuild and fail on any difference. This runs
  # npm, which executes package scripts, so it is its OWN job: contents: read, no
  # persisted credential, no npm cache, and no workspace shared with the jobs that hold
  # contents: write or run `go ./...`. `build` needs it. The wait is minutes; the next
  # run picks the release up once the sync PR has merged.
  web-bundle:
    name: Committed web/dist is current
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Set up Node
      if: vars.WEB_DIST_SYNC == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Committed web/dist matches web/src
      if: vars.WEB_DIST_SYNC == 'true'
      run: |
        make web-build
        dirty="$(git status --porcelain -- web/dist)"
        if [ -n "$dirty" ]; then
          echo "::error::web/dist is stale: it does not match a fresh build of web/src, so a release would embed an old web client."
          echo "$dirty"
          echo "web-dist-sync.yml proposes the fix as a dist-only PR (branch web-dist-sync); release once it has merged."
          exit 1
        fi

  build:
    name: Build
    needs: [check, web-bundle]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    # The exact commit the check job validated — not a tag, which does not
    # exist yet by design (#5159).
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        VERSION="${{ needs.check.outputs.new_version }}"
        ARCHIVE_NAME=agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}
        mkdir -p dist
        go build -v -ldflags "-X main.version=${VERSION}" -o dist/agent-factory
        cd dist
        tar czf ../${ARCHIVE_NAME}.tar.gz agent-factory

    # The sandbox/ssh transports STREAM an af release binary onto the remote
    # host and exec it there (#5571 W2.2). A remote linux host's libc is
    # whatever its image ships — musl, an older glibc, or none — so the
    # streamed binary is a separate CGO_ENABLED=0 build published alongside as
    # agent-factory-linux-<arch>-static.tar.gz. The installed artifacts stay
    # DYNAMIC on purpose: CGO off switches the daemon's own resolver to pure
    # Go, which cannot honour NSS hosts modules (mDNS/LDAP/SSSD ordered ahead
    # of DNS), and the ssh dial-pin would then pin a different address than
    # ssh resolves for the same name.
    - name: Build the static sandbox-host binary
      if: matrix.goos == 'linux'
      env:
        GOOS: linux
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: |
        VERSION="${{ needs.check.outputs.new_version }}"
        ARCHIVE_NAME=agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}-static
        mkdir -p dist-static
        go build -v -ldflags "-X main.version=${VERSION}" -o dist-static/agent-factory
        cd dist-static
        tar czf ../${ARCHIVE_NAME}.tar.gz agent-factory

    # The daemon untars this archive onto a sandbox host and runs `af version`
    # there — do exactly that against the just-built artifact so a binary that
    # cannot execute on a bare host fails here, not on a user's machine. Both
    # linux legs must be statically linked; only the native amd64 leg can also
    # exec it for `version`, and that run must print the RELEASE version, not
    # merely exit 0 — an unstamped build prints "dev" and exits 0 (#5666). The
    # arm64 leg is this same step on another GOARCH, so that it is stamped is
    # pinned by scripts/release_version_stamp_test.go rather than executed.
    - name: Smoke-test the static sandbox-host artifact
      if: matrix.goos == 'linux'
      env:
        VERSION: ${{ needs.check.outputs.new_version }}
      run: |
        tmp="$(mktemp -d)"
        tar xzf "agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}-static.tar.gz" -C "$tmp"
        file "$tmp/agent-factory" | grep -q "statically linked"
        if [ "${{ matrix.goarch }}" = amd64 ]; then
          .github/scripts/assert-binary-version.sh "$tmp/agent-factory" "$VERSION"
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}-static.tar.gz
        if-no-files-found: warn
        retention-days: 1

  release:
    name: Release
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    - name: Generate checksum manifest
      run: .github/scripts/write-sha256sums.sh dist

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.check.outputs.new_version }}
        GH_REPO: ${{ github.repository }}
        TARGET: ${{ github.sha }}
      run: |
        # A previous run may have died between drafting and publishing — or
        # stranded a tag under the pre-#5159 scheme — leaving residue that
        # would collide with this create or pin the tag to a stale commit.
        .github/scripts/release-forget-version.sh "$VERSION"

        # Immutable releases require all assets to be attached before the
        # release is published: create as draft, upload assets into the draft,
        # then publish. A draft creates NO git ref, and publishing creates the
        # tag at TARGET atomically with the release — the first moment a tag
        # can exist on origin is the moment its release exists too (#5159).
        # Previews are prereleases and must NOT be marked --latest: the
        # releases/latest redirect (install.sh, fresh installs) stays pinned to
        # the newest stable release; auto-update resolves previews via the API.
        gh release create "v${VERSION}" \
          --title "v${VERSION}" \
          --target "$TARGET" \
          --generate-notes \
          --prerelease \
          --draft \
          dist/*.tar.gz \
          dist/sha256sums.txt
        gh release edit "v${VERSION}" --draft=false

    # A cancelled job runs no cleanup, so self-healing lives in the pre-create
    # forget above; this step covers an ordinary failure mid-publish (e.g. a
    # failed asset upload) leaving a draft behind.
    - name: Forget the version on failure
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.check.outputs.new_version }}
        GH_REPO: ${{ github.repository }}
      run: .github/scripts/release-forget-version.sh "$VERSION"
