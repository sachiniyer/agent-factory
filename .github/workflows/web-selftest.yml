name: Web selftest

# The Playwright web-driver selftest (#1592 Phase 5 PR6, docs/dev/web-selftest.md):
# a real af daemon on a throwaway home, two seeded sessions behind a fake agent,
# and the embedded SPA driven in a headless Chromium. It is the acceptance proof
# for the web client and, until #2069, it ran only when someone typed `make
# web-selftest-container` by hand.
#
# It lives in its OWN workflow rather than as a job in pr.yml because it is
# REUSABLE: pr.yml calls it (`jobs.web-selftest.uses`) so that Build can list it in
# `needs` and it actually gates, while the `push` trigger below runs the same
# definition on master. One harness definition, two schedules — a CI-only second
# copy is how the thing CI runs stops being the thing developers run.
#
# The fast, deterministic web checks (parity tests + bundle reproducibility) gate
# separately — they are the `Web` job in pr.yml, and they run on every PR.

on:
  # Master (#2762). Before this trigger existed the suite ran on `pull_request`
  # only, so nothing ever ran it on master: a red run could merge (it did not gate
  # either) and then stayed invisible until some later PR happened to touch these
  # paths — and then it looked like THAT PR's fault. Same shape as #2576, where
  # tui-driver-selftest sat red on master for two days.
  #
  # This is a signal run, not a gate: master has already merged. Its job is to name
  # the commit, so nobody inherits a bisect.
  push:
    branches: [master]
    paths:
      # KEEP IN SYNC with SELFTEST_PATHS in .github/scripts/web-selftest-scope.js,
      # which is the source of truth for the PR-side filter. A trigger `paths:`
      # cannot be computed, so this list is a literal copy — and
      # web-selftest-scope.test.js reads this file and fails Lint if the two ever
      # disagree, so the copy cannot drift silently.
      #
      # Go source wholesale. The harness BUILDS AND RUNS the whole `af` binary —
      # it seeds through `$BIN sessions create` and `$BIN tasks add` and the spec
      # round-trips those flows — so the packages that can break it are not a list
      # anyone enumerates correctly (two review rounds proved that). Measured cold
      # at ~4 minutes, in parallel with the longer Test jobs, so a Go-touching PR
      # pays approximately nothing. Docs- and prose-only PRs still skip.
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      # The SPA itself, and the committed bundle the harness actually serves.
      - 'web/**'
      # Kept alongside '**/*.go' deliberately: these carry non-Go files (testdata,
      # fixtures) the suite can depend on. #1932 (a header that went stale) and
      # #1894 (a detach that dropped scroll) were both found here.
      - 'daemon/**'
      - 'agentproto/**'
      - 'apiproto/**'
      # The harness itself — the WHOLE invocation chain. CI runs `make
      # web-selftest-container`, so the closure is Makefile -> scripts/testbox.sh ->
      # Dockerfile.web-selftest + web-selftest-entry.sh -> copy-src.sh (sourced by
      # the entry to stage /src into /work). A PR editing only one link must run the
      # suite it just changed.
      - 'Makefile'
      - 'scripts/testbox.sh'
      - 'scripts/container/Dockerfile.web-selftest'
      - 'scripts/container/web-selftest-entry.sh'
      - 'scripts/container/copy-src.sh'
      - '.github/workflows/web-selftest.yml'
      # The CI wiring that decides whether this gates, and the filter that decides
      # when it runs. A change to either must re-prove the gate on its own PR.
      - '.github/workflows/pr.yml'
      - '.github/scripts/web-selftest-scope.js'

  # The PR gate. A job in ANOTHER workflow cannot be a `needs` dependency, which is
  # why this is `workflow_call` and not a second `pull_request` trigger: pr.yml
  # calls it as a job, and pr.yml's Build — one of the repo's two required checks
  # (ruleset 14851503) — lists that job in `needs`. See "How this gates" below.
  #
  # There is deliberately NO `paths:` here. A called workflow does not honour one
  # (filters apply to pull_request/push only), and the caller does the scoping with
  # .github/scripts/web-selftest-scope.js so the decision is tested rather than
  # implicit.
  workflow_call:

  # Manual re-run, for "did master recover?" after a red push run. No path filter
  # applies to a dispatch, so this always runs the suite.
  workflow_dispatch:

concurrency:
  # Three kinds of run share the ref refs/heads/master and must not cancel each
  # other (#5660): this workflow's own push run, a pr.yml reusable call
  # (schedule, merge_group, dispatch), and a manual dispatch of this workflow.
  # In a called workflow `github.workflow` is the CALLER's name, so it tells the
  # first two apart without a second input; the event adds the nightly and
  # dispatch lanes. Within one lane a newer master push supersedes a stale run
  # (the tip is the question; a burst of merges verifies the last one), and a
  # superseded run is always replaced by a newer run of the same lane — a push
  # that matches no `paths:` filter starts no run and so cancels none. merge_group
  # refs are unique per queue entry, so entries never cancel each other.
  group: web-selftest-${{ github.workflow == 'Web selftest' && 'standalone' || 'called' }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  cancel-in-progress: true

# Read-only: checks out source and runs the harness in a container. It never
# comments on or modifies the PR. pr.yml grants the same, which is what lets it
# call this workflow — a called workflow can never request more than its caller.
permissions:
  contents: read

jobs:
  selftest:
    name: Web selftest
    # Pinned to 24.04 until #6281 (26.04 compatibility) lands.
    runs-on: ubuntu-24.04
    # The image build (Go + Node + Chromium + system deps) dominates a cold run.
    # GitHub gives no persistent docker layer cache between runs, so budget for
    # the cold path every time — but not for a hung browser burning six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # PRs no longer carry web/dist (#6447), so the committed bundle can lag the
      # source under test. Build the bundle from this tree first; the container
      # copies the working tree, dist included, so the suite drives what this
      # source would ship.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web bundle
        run: make web-build

      # `make web-selftest-container` is the ONLY sanctioned entry point
      # (docs/dev/web-selftest.md), and CI uses it verbatim rather than reimplementing
      # the steps — a CI-only copy of the harness is how the thing CI runs stops
      # being the thing developers run. The ubuntu runner ships Docker, which is
      # all the target needs; pr.yml's macOS job cannot host it for exactly this
      # reason.
      #
      # Everything (daemon, tmux, browser) lives on 127.0.0.1 inside an ephemeral
      # container with no published ports, so this is as isolated on a runner as
      # it is on a dev box.
      #
      # STEP timeout, deliberately below the JOB's 40 above. A job that burns its
      # whole budget is terminated by the runner, and the upload step below — the
      # one that exists for exactly this hung-browser case — may never get to run.
      # Capping the harness at 35 leaves 5 minutes of job budget for the rescue,
      # so the timeout path produces the artifact instead of consuming it.
      - name: Run the web-driver selftest
        timeout-minutes: 35
        run: make web-selftest-container

      # The trace zip, the screenshots and the daemon logs (#3505). This comment
      # used to explain why there was NO upload here: Playwright wrote its traces
      # to /work/web/test-results inside the container, so `--rm` destroyed them
      # and there was nothing on the host to upload. That was true, and it made
      # every web-selftest red undebuggable by design — while the reporter cheerily
      # printed `npx playwright show-trace test-results/.../trace.zip` for a file
      # that had never existed outside the container. Both halves are fixed:
      # testbox.sh now bind-mounts that directory, and this step ships it.
      #
      # `always()`, not `failure()`: the case where a trace is worth most is a run
      # that timed out or was CANCELLED — a hung browser — and `failure()` does not
      # run on cancellation. The step timeout above is what leaves room for this one. Playwright only retains a trace
      # `on-failure`, so a green run leaves nothing uploadable here: measured, it
      # is three EMPTY per-test output dirs (which upload-artifact skips) plus a
      # hidden `.last-run.json` (which it excludes unless include-hidden-files is
      # set). if-no-files-found: ignore turns that into a silent no-op rather than
      # a warning that reads like a lost artifact.
      #
      # continue-on-error, because rescuing diagnostics must never CHANGE a verdict:
      # a failed upload cannot turn a green run red, and it cannot mask a red one
      # either (the harness step above has already decided the job).
      #
      # On contents: the fixture is a throwaway container — mock repos, a fake
      # agent, probe-* sessions — and the trace was inspected before this step was
      # wired (53 screenshots, API JSON, no host paths, no credentials). Note the
      # trace DOES record full request and response headers; there is no
      # Authorization header to capture only because the loopback browser is
      # tokenless under #1696, not because Playwright redacts anything. If this
      # harness ever drives a token-bearing request, re-check this before shipping.
      - name: Upload the Playwright trace and daemon logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-selftest-artifacts
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

# ── How this gates ────────────────────────────────────────────────────────────
#
# This repo's ruleset (14851503) requires only "Lint" and "Build", so a new job
# gates nothing unless pr.yml's Build job lists it in `needs` — the mechanism
# documented on the auto-gate helper test. That is how this gates:
#
#   pr.yml: web-selftest-scope ─► web-selftest (uses: this workflow) ─► Build needs
#
# and Build fails loudly on any unsuccessful need rather than skipping, so a red
# selftest turns the REQUIRED check red. A `skipped` need is fine and expected —
# that is the scope job saying this PR cannot reach the web client.
#
# The two costs that once argued against gating are answered by the scope job, not
# waived:
#
#   * Cost: a cold Go+Node+Chromium image build plus a daemon+browser boot. It is
#     now paid only by PRs that touch the paths listed above; a docs typo skips it
#     in seconds. Master pays it per matching commit, where it blocks nothing.
#   * Flake surface: it drives a real browser against a real daemon over a real
#     PTY, and a flaky REQUIRED check blocks every merge in the repo. That risk is
#     real and the answer is to keep it honest, never to defang it: a red run gets
#     investigated, because twice on 2026-07-21 a "flake" here was a genuine
#     product race (#2311, #2341). Retries, raised timeouts and xfail are how a
#     real signal becomes silence.
#
# ── Why this BUILDS the bundle first (#6447) ─────────────────────────────────
#
# The harness builds af from source and web/embed.go embeds web/dist. Until #6447
# the committed dist was always in step with web/src (every web PR carried it, and
# pr.yml's Web job proved it), so this suite could serve the committed bundle.
# PRs no longer carry web/dist: web-dist-sync.yml commits it after the source
# lands, so on a PR (and for a few minutes on master) the committed bundle lags the
# source. Serving it would test the OLD bundle against the NEW source, so the
# `make web-build` step above builds from this tree and the container copies it in.
# Locally, run `make web-build` before `make web-selftest-container` or you
# validate whatever bundle is in your tree.
