name: Auto Merge

# Throughput mode (see .github/auto-merge.md): squash-merge every open master PR
# with green Build + Lint on its current head, no conflict, no hold label and no
# unanswered P1 Codex finding.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['PR Validation', 'Build', 'Lint']
    types: [completed]

# Only a read of the repository by default: every job asks for its own,
# which replaces this entirely (#7165). Block form, because the workflow
# scans in auto-gate.test.js do not read flow-style mappings.
permissions:
  contents: read

# One merger at a time; a pending run replaces an older pending one.
concurrency:
  group: auto-merge
  cancel-in-progress: false

# No code a PR controls runs where the write token or secrets are (#7165). The
# composition checks (recheck, fixcheck, compose) run merged or PR-controlled
# code, so each is a job of its own: contents: read, no secrets, no persisted
# credentials, no Go cache saved (release builds restore default-branch
# caches). The other jobs run only auto-merge.js, from a fresh checkout of the
# commit this workflow file came from, and read nothing from a check but its
# verdict: pass or fail, the sha checked, and the fixes that passed.
#
#   gate ──┬── recheck ──┬── land ── compose ── report
#          └── fixcheck ─┘
jobs:
  gate:
    name: Read the merge state
    # Kill switch: set the repository variable AUTO_MERGE_ENABLED to 'false'.
    # Master only: a dispatch with --ref <branch> would check out that branch
    # as github.workflow_sha and run its auto-merge.js with the write token.
    # Every job waits on this one, and every real dispatch uses --ref master.
    if: vars.AUTO_MERGE_ENABLED != 'false' && github.ref == 'refs/heads/master'
    # Pinned to 24.04 until #6281 (26.04 compatibility) lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    outputs:
      skip: ${{ steps.debounce.outputs.skip }}
      broken: ${{ steps.halt.outputs.broken }}
      broken_number: ${{ steps.halt.outputs.broken_number }}
      candidates: ${{ steps.fixes.outputs.candidates }}
    steps:
      - name: Check out the merger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Debounce workflow_run triggers
        id: debounce
        uses: actions/github-script@v8
        with:
          script: |
            // Skips a workflow_run trigger only when a merger run that started
            // after the triggering run completed (or one already queued) will read
            // state at least as new. Never merely because a run was "recent".
            await require('./.github/scripts/auto-merge.js').checkDebounce({ github, core, context });

      - name: Check for a broken-master halt
        id: halt
        if: steps.debounce.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').checkHalt({ github, core, context });

      # While a composition halt holds, only a fix-master PR may land, and only
      # once its would-be merge result passes the same composition check (#7151).
      # Picked whenever master is broken, so fixcheck runs beside recheck; if
      # the re-check then passes, the halt is over and the pick goes unused.
      # No USING_PAT here: a job receives every secret it names, even in a test
      # of whether one is set, so this job names none (#7194). The pick
      # therefore skips PRs touching workflows or .github/scripts on any token.
      - name: Pick fix-master PRs for the halted master
        id: fixes
        if: steps.debounce.outputs.skip != 'true' && (steps.halt.outputs.broken == 'true')
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').pickHaltFixes({ github, core, context });

  recheck:
    name: Re-check master composition
    needs: gate
    if: needs.gate.outputs.broken == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.recheck.outcome == 'success' }}
      sha: ${{ steps.recheck_checkout.outputs.commit }}
    steps:
      - name: Check out master
        id: recheck_checkout
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Re-check master composition
        id: recheck
        continue-on-error: true
        run: |
          go build ./...
          go vet ./...
          scripts/lint-file-length.sh

  fixcheck:
    name: Compose-check fixes for the halted master
    needs: gate
    if: needs.gate.outputs.candidates != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.fixcheck.outcome == 'success' }}
      fixes: ${{ steps.fixcheck.outputs.fixes }}
      base: ${{ steps.fixcheck.outputs.base }}
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Each candidate is squash-merged onto master in its own scratch worktree.
      # Nothing the PR controls runs: go build and go vet do not execute the
      # tree's code, and the lint is master's script, restored into the tree by
      # git, which never writes through a symlink the PR planted. It must sit in
      # the tree because it lints its own parent directory. Every candidate is
      # checked, so a merge GitHub refuses falls through to the next. The
      # checkout is depth 1, and a squash merge needs the merge base, hence
      # --unshallow.
      - name: Compose-check each fix-master candidate
        id: fixcheck
        continue-on-error: true
        env:
          CANDIDATES: ${{ needs.gate.outputs.candidates }}
        run: |
          git fetch --no-tags --quiet --unshallow origin master
          base=$(git rev-parse FETCH_HEAD)
          passed=""
          for candidate in $CANDIDATES; do
            number=${candidate%%:*}
            head=${candidate#*:}
            tree="$RUNNER_TEMP/fix-$number"
            if git fetch --no-tags --quiet origin "$head" &&
              git worktree add --quiet --detach "$tree" "$base" &&
              (cd "$tree" &&
                git -c user.name=auto-merge -c user.email=auto-merge@invalid merge --squash --quiet "$head" &&
                git checkout "$base" -- scripts/lint-file-length.sh &&
                go build ./... &&
                go vet ./... &&
                bash scripts/lint-file-length.sh); then
              passed="$passed $candidate"
            else
              echo "::warning::#$number does not pass the composition check once merged onto master $base."
            fi
          done
          test -n "$passed"
          printf 'fixes=%s\nbase=%s\n' "${passed# }" "$base" >> "$GITHUB_OUTPUT"

  land:
    name: Merge ready PRs
    needs: [gate, recheck, fixcheck]
    # Runs whether or not the checks ran; a check that did not report passed
    # counts as failed.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      checks: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merged_prs: ${{ steps.merge.outputs.merged_prs }}
    steps:
      - name: Check out the merger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Settle the broken-master issue
        id: settle
        if: needs.gate.outputs.broken == 'true'
        uses: actions/github-script@v8
        env:
          BROKEN_NUMBER: ${{ needs.gate.outputs.broken_number }}
          RECHECK_PASSED: ${{ needs.recheck.outputs.passed }}
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').settleBroken({
              github, core, context,
              passed: process.env.RECHECK_PASSED === 'true',
              number: process.env.BROKEN_NUMBER,
            });

      - name: Merge ready PRs
        id: merge
        if: steps.settle.outputs.halted != 'true' || needs.fixcheck.outputs.passed == 'true'
        uses: actions/github-script@v8
        env:
          USING_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          AUTO_MERGE_BATCH_SIZE: ${{ vars.AUTO_MERGE_BATCH_SIZE }}
          HALTED: ${{ steps.settle.outputs.halted }}
          FIX_CHECK_PASSED: ${{ needs.fixcheck.outputs.passed }}
          FIX_LIST: ${{ needs.fixcheck.outputs.fixes }}
          FIX_BASE: ${{ needs.fixcheck.outputs.base }}
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          script: |
            const merger = require('./.github/scripts/auto-merge.js');
            if (process.env.HALTED !== 'true') {
              await merger.mergeAll({ github, core, context });
            } else {
              await merger.mergeHaltFix({
                github, core, context,
                passed: process.env.FIX_CHECK_PASSED === 'true',
                fixes: process.env.FIX_LIST,
                base: process.env.FIX_BASE,
              });
            }

  compose:
    name: Post-merge composition check
    needs: land
    # Whatever merged is checked, even if land failed after merging it.
    if: ${{ !cancelled() && needs.land.outputs.merged == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.compose.outcome == 'success' }}
      sha: ${{ steps.compose_checkout.outputs.commit }}
    steps:
      - name: Check out the new master head
        id: compose_checkout
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Post-merge composition check
        id: compose
        continue-on-error: true
        run: |
          go build ./...
          go vet ./...
          scripts/lint-file-length.sh

  report:
    name: Report broken master
    needs: [land, compose]
    # A check that did not report passed counts as failed.
    if: ${{ !cancelled() && needs.land.outputs.merged == 'true' && needs.compose.outputs.passed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the merger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Report broken master
        id: report
        uses: actions/github-script@v8
        env:
          MASTER_SHA: ${{ needs.compose.outputs.sha }}
          MERGED_PRS: ${{ needs.land.outputs.merged_prs }}
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').reportBroken({
              github, core, context, merged: process.env.MERGED_PRS,
            });
