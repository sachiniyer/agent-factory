name: Auto Merge

# Throughput mode (see .github/auto-merge.md): squash-merge every open master PR
# with green Build + Lint on its current head, no conflict, no hold label and no
# unanswered P1 Codex finding.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['PR Validation', 'Build', 'Lint']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  checks: read

# One merger at a time; a pending run replaces an older pending one.
concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge ready PRs
    # Kill switch: set the repository variable AUTO_MERGE_ENABLED to 'false'.
    if: vars.AUTO_MERGE_ENABLED != 'false'
    # Pinned to 24.04 until #6281 (26.04 compatibility) lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # No token is left in the repository's git config, so code under a
      # scratch worktree below cannot read one (checkout includes its persisted
      # credentials into every linked worktree). Every later git operation in
      # this job is an anonymous fetch of this public repository.
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Debounce workflow_run triggers
        id: debounce
        uses: actions/github-script@v8
        with:
          script: |
            // Skips a workflow_run trigger only when a merger run that started
            // after the triggering run completed (or one already queued) will read
            // state at least as new. Never merely because a run was "recent".
            await require('./.github/scripts/auto-merge.js').checkDebounce({ github, core, context });

      - name: Check for a broken-master halt
        id: halt
        if: steps.debounce.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').checkHalt({ github, core, context });

      - name: Set up Go
        if: steps.debounce.outputs.skip != 'true' && (steps.halt.outputs.broken == 'true')
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Re-check master composition
        id: recheck
        if: steps.debounce.outputs.skip != 'true' && (steps.halt.outputs.broken == 'true')
        continue-on-error: true
        run: |
          go build ./...
          go vet ./...
          scripts/lint-file-length.sh

      - name: Settle the broken-master issue
        id: settle
        if: steps.debounce.outputs.skip != 'true' && (steps.halt.outputs.broken == 'true')
        uses: actions/github-script@v8
        env:
          BROKEN_NUMBER: ${{ steps.halt.outputs.broken_number }}
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').settleBroken({
              github, core, context,
              passed: process.env.RECHECK_OUTCOME === 'success',
              number: process.env.BROKEN_NUMBER,
            });

      # While a composition halt holds, only a fix-master PR may land, and only
      # once its would-be merge result passes the same composition check (#7151).
      - name: Pick fix-master PRs for the halted master
        id: fixes
        if: steps.debounce.outputs.skip != 'true' && (steps.settle.outputs.halted == 'true')
        uses: actions/github-script@v8
        env:
          USING_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').pickHaltFixes({ github, core, context });

      # Each candidate is squash-merged onto master in its own scratch worktree,
      # so this checkout, whose auto-merge.js the merge step loads, is never
      # touched. Nothing the PR controls runs: go build and go vet do not
      # execute the tree's code, and the lint is master's script, restored into
      # the tree by git, which never writes through a symlink the PR planted.
      # It must sit in the tree because it lints its own parent directory.
      # Every candidate is checked, so a merge GitHub refuses falls through to
      # the next. The checkout is depth 1, and a squash merge needs the merge
      # base, hence --unshallow.
      - name: Compose-check a fix on the halted master
        id: fixcheck
        if: steps.debounce.outputs.skip != 'true' && (steps.fixes.outputs.candidates != '')
        continue-on-error: true
        env:
          CANDIDATES: ${{ steps.fixes.outputs.candidates }}
        run: |
          git fetch --no-tags --quiet --unshallow origin master
          base=$(git rev-parse FETCH_HEAD)
          passed=""
          for candidate in $CANDIDATES; do
            number=${candidate%%:*}
            head=${candidate#*:}
            tree="$RUNNER_TEMP/fix-$number"
            if git fetch --no-tags --quiet origin "$head" &&
              git worktree add --quiet --detach "$tree" "$base" &&
              (cd "$tree" &&
                git -c user.name=auto-merge -c user.email=auto-merge@invalid merge --squash --quiet "$head" &&
                git checkout "$base" -- scripts/lint-file-length.sh &&
                go build ./... &&
                go vet ./... &&
                bash scripts/lint-file-length.sh); then
              passed="$passed $candidate"
            else
              echo "::warning::#$number does not pass the composition check once merged onto master $base."
            fi
          done
          test -n "$passed"
          printf 'fixes=%s\nbase=%s\n' "${passed# }" "$base" >> "$GITHUB_OUTPUT"

      - name: Merge ready PRs
        id: merge
        if: steps.debounce.outputs.skip != 'true' && (steps.settle.outputs.halted != 'true' || steps.fixcheck.outcome == 'success')
        uses: actions/github-script@v8
        env:
          USING_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          AUTO_MERGE_BATCH_SIZE: ${{ vars.AUTO_MERGE_BATCH_SIZE }}
          HALTED: ${{ steps.settle.outputs.halted }}
          FIX_CHECK: ${{ steps.fixcheck.outcome }}
          FIX_PASSED: ${{ steps.fixcheck.outputs.fixes }}
          FIX_BASE: ${{ steps.fixcheck.outputs.base }}
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          script: |
            const merger = require('./.github/scripts/auto-merge.js');
            if (process.env.HALTED !== 'true') {
              await merger.mergeAll({ github, core, context });
            } else {
              await merger.mergeHaltFix({
                github, core, context,
                passed: process.env.FIX_CHECK === 'success',
                fixes: process.env.FIX_PASSED,
                base: process.env.FIX_BASE,
              });
            }

      - name: Move to the new master head
        id: head
        if: steps.debounce.outputs.skip != 'true' && (steps.merge.outputs.merged == 'true')
        run: |
          git fetch --quiet origin master
          git checkout --quiet --detach origin/master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go (post-merge)
        if: steps.debounce.outputs.skip != 'true' && (steps.merge.outputs.merged == 'true' && steps.halt.outputs.broken != 'true')
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Post-merge composition check
        id: compose
        if: steps.debounce.outputs.skip != 'true' && (steps.merge.outputs.merged == 'true')
        continue-on-error: true
        run: |
          go build ./...
          go vet ./...
          scripts/lint-file-length.sh

      - name: Report broken master
        if: steps.debounce.outputs.skip != 'true' && (steps.merge.outputs.merged == 'true' && steps.compose.outcome != 'success')
        uses: actions/github-script@v8
        env:
          MASTER_SHA: ${{ steps.head.outputs.sha }}
          MERGED_PRS: ${{ steps.merge.outputs.merged_prs }}
        with:
          script: |
            await require('./.github/scripts/auto-merge.js').reportBroken({
              github, core, context, merged: process.env.MERGED_PRS,
            });
