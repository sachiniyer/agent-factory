name: Build

on:
  push:
    branches: [ master ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build.yml'

  # A merge performed with GITHUB_TOKEN does not trigger `push`, so an auto-gate
  # merge would land on master without this gate ever running (#3435). The gate
  # re-raises it here by hand; `workflow_dispatch` is the documented exception to
  # that suppression. No `paths:` filter applies to a dispatch, so it always runs.
  workflow_dispatch:

# Read-only: workflow only checks out source, runs tests, and uploads artifacts (artifact upload uses the Actions API, not repo contents).
permissions:
  contents: read

jobs:
  build:
    name: Build Binary and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    # internal/shellsuggest claims correctness in sh, bash AND zsh, and its tests
    # FAIL rather than skip when a claimed shell is missing (#1978/#1988). Every
    # lane that runs `go test` therefore needs zsh, not just pr.yml — this job
    # runs the suite on the release matrix, and auto-release/stable-release run it
    # too. The runner is ubuntu regardless of the GOOS/GOARCH it builds for.
    # Routed through scripts/ci-apt-install.sh so a third-party source in the
    # runner image cannot fail this step by failing the update (#3774).
    - name: Install zsh
      run: scripts/ci-apt-install.sh zsh

    # Every matrix cell runs this step on the amd64 ubuntu runner — GOOS/GOARCH are
    # set only on the Build step below, so `go test` compiles and runs the SAME
    # amd64 binary in all four cells (the arch appears only in the cell's name, not
    # in what the tests execute; there is no QEMU here). Running the full
    # timing-sensitive E2E/integration suite four times over quadruples the odds a
    # racy test reds this post-merge Build check — the two flakes in #2052 were
    # labelled (linux, arm64) but actually ran on amd64. Run the full suite once,
    # on linux/amd64 (the native-amd64 signal the issue keeps), and run the other
    # three cells with -short, which skips the testing.Short()-gated E2E/integration
    # tests while still compiling the tree and running the fast unit tests. The
    # required PR gates (pr.yml Test + Test (macOS), both -race) run the FULL suite
    # with no -short, so native E2E/integration coverage is unchanged.
    #
    # -timeout is explicit on both branches: Go's default is 10m PER PACKAGE, and
    # the daemon package sits close to it. Run 35205849014 (v1.0.290) measured
    # daemon at 404.5s, 402.0s and 399.7s in three cells and 600.014s — a panic —
    # in the fourth, a uniformly slow runner (per-test time summed to 599.4s,
    # 1.5x its siblings across ~550 tests, no test over 13.4s; it needed ~603s).
    # -short barely touches daemon (2-3 skips), so both branches get one number.
    # 20m is 2x that slow-runner run and 3x the ordinary one; only a real wedge
    # reaches it. scripts/go_test_timeout_test.go keeps every lane explicit.
    - name: Run tests
      run: |
        if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = "linux/amd64" ]; then
          go test -v -timeout=20m ./...
        else
          go test -short -v -timeout=20m ./...
        fi

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -v -o build/${{ matrix.goos }}_${{ matrix.goarch }}/agent-factory

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/${{ matrix.goos }}_${{ matrix.goarch }}/*
        retention-days: 7
