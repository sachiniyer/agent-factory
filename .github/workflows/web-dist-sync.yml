name: Web dist sync

# Keeps the committed web/dist bundle equal to a fresh build of web/src without
# making any web PR carry it (#6447). web/dist stays in the tree because
# web/embed.go embeds it and `go build` / `go install` / ./dev-install.sh must
# stay Node-free. What changes is who writes it: pull requests never do (the Web
# job in pr.yml rejects one that touches web/dist), and this workflow proposes it
# after the source lands, as a dist-only PR on the bot branch `web-dist-sync`,
# labelled `fix-master` so the existing auto-merger lands it.
#
# ── Rollout switch ───────────────────────────────────────────────────────────
#
# Everything about this model is OFF until the repository variable WEB_DIST_SYNC is
# `true`: while it is unset, PR Validation keeps the old rule (a PR carries a web/dist
# that matches a fresh build) and the release workflows skip their freshness job.
# That ordering matters: enabling it before the credential below exists would leave
# master's bundle stale with nothing able to repair it and every release refused. The
# owner enables it, in this order:
#   1. create the repository secret WEB_DIST_SYNC_TOKEN (below);
#   2. set the repository variable WEB_DIST_SYNC=true.
# When enabled and the secret is missing, `propose` FAILS, loudly, instead of quietly
# degrading.
#
# ── Security model (read before editing; this workflow can write to the repo) ──
#
#   * It never runs PR code. Triggers are `push` to master (already merged, already
#     reviewed code), `workflow_dispatch` and `schedule`, and every job requires
#     `github.ref == refs/heads/master`. There is NO `pull_request_target` and no
#     checkout of a PR ref anywhere.
#   * The job that runs repo-controlled scripts (`npm ci`, esbuild) is `build`. It
#     has `contents: read`, persists no credentials and sees no secret.
#   * The job that holds the write credential is `propose`. It executes NO repo
#     code except web-dist-guard.sh, a data-validating shell script read from the
#     master tree it checked out. It treats the `build` artifact as untrusted data:
#     the guard refuses anything but plain, safely named, size-bounded files, and
#     only web/dist/ is ever staged (the staged tree is diffed against current
#     master and must differ only under web/dist). The credential is passed to
#     exactly two steps (the push and the `gh` calls) through their environment, and
#     checkout persists none.
#   * The credential is a DEDICATED secret, WEB_DIST_SYNC_TOKEN: a fine-grained PAT
#     (or GitHub App token) scoped to this repository with Contents and Pull requests
#     read/write and nothing else. It is deliberately NOT AUTO_MERGE_TOKEN: setting
#     that one switches the whole merger onto it (auto-merge.yml), which drops the
#     workflow-file guard. A PAT is required because pushes and PRs made with
#     GITHUB_TOKEN start no workflows, so the checks the merger requires would never
#     run; there is no GITHUB_TOKEN fallback.
#   * Defence in depth: the PR it opens runs the Web job in pr.yml, which rebuilds
#     web/dist from the PR's own merge tree on a read-only runner and fails if it is
#     not byte-identical. A tampered artifact cannot reach master without matching an
#     independent build of the source on master.
#   * The branch is only ever fast-forwarded (a `merge -s ours` of the old tip keeps
#     it a descendant), never force-pushed.
#   * Ordering: a run builds from the commit that triggered it, and only proposes
#     when that commit is master's head, or master has moved without touching the
#     bundle's inputs. Otherwise a re-run or out-of-order run is skipped, so it can
#     never propose a tree that reverts newer source.
#   * Codex: the bot does not request a Codex review on the sync PR (it never writes
#     the trigger), so no unanswered finding can sit on a PR nobody reads. The Web
#     job's byte-equality check is its review. If a finding appears anyway, it blocks
#     the merger like any other and the maintainer answers it.

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '!web/dist/**'
      - 'design/**'
      - '.github/workflows/web-dist-sync.yml'
  # GITHUB_TOKEN merges (the auto-merger's) fire no push event (#3435), so
  # auto-merge.js dispatches this after a batch; workflow_dispatch is the one event
  # that token may start. No `paths:` filter applies to a dispatch.
  workflow_dispatch:
  # Backstop: heals a missed dispatch, a failed run, or a merge nobody re-raised.
  # The run is idempotent, so a quiet repo pays only the build.
  schedule:
    - cron: '23 */3 * * *'

concurrency:
  # One sync at a time and never cancel one mid-push; a pending run builds from the
  # newest head, so a batch of merges coalesces into one PR update.
  group: web-dist-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build web/dist
    if: github.repository == 'sachiniyer/agent-factory' && github.ref == 'refs/heads/master' && vars.WEB_DIST_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same toolchain as pr.yml's Web job (npm ci from the lockfile, then esbuild).
      - name: Build the bundle
        run: make web-build

      - id: diff
        name: Compare with the committed bundle
        run: |
          # porcelain, not diff: a new untracked chunk must count too.
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the rebuilt bundle
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  propose:
    name: Propose web/dist PR
    needs: build
    if: github.ref == 'refs/heads/master' && vars.WEB_DIST_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reads only; the write credential is the dedicated token, not this one.
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
      BRANCH: web-dist-sync
      SRC_SHA: ${{ github.sha }}
      BUILT_SHA: ${{ needs.build.outputs.sha }}
      CHANGED: ${{ needs.build.outputs.changed }}
    steps:
      - id: token
        name: Require WEB_DIST_SYNC_TOKEN
        env:
          WEB_DIST_SYNC_TOKEN: ${{ secrets.WEB_DIST_SYNC_TOKEN }}
        run: |
          if [ -n "$WEB_DIST_SYNC_TOKEN" ]; then
            exit 0
          fi
          msg="WEB_DIST_SYNC is enabled but the secret WEB_DIST_SYNC_TOKEN is not set, so web/dist cannot be synced."
          echo "::error title=web/dist sync has no credential::$msg"
          {
            echo "### $msg"
            echo
            echo "Create a fine-grained PAT (or GitHub App token) for this repository only with Contents and Pull requests read/write, store it as \`WEB_DIST_SYNC_TOKEN\`, and re-run."
            echo "This workflow deliberately does not fall back to \`GITHUB_TOKEN\` (its pushes and PRs start no checks) and does not use \`AUTO_MERGE_TOKEN\` (setting that switches the whole merger onto it). Until it exists, unset the \`WEB_DIST_SYNC\` variable."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # No credential on disk: the checkout persists none and the token is handed to
      # the two steps that need it, below.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: base
        name: Decide what to propose against
        run: |
          set -euo pipefail
          if [ "$BUILT_SHA" != "$SRC_SHA" ]; then
            echo "::error::the build job built $BUILT_SHA, not $SRC_SHA"
            exit 1
          fi
          git fetch -q --no-tags --depth=200 origin master
          master="$(git rev-parse origin/master)"
          action=propose
          base="$master"
          if [ "$SRC_SHA" != "$master" ]; then
            if ! git merge-base --is-ancestor "$SRC_SHA" "$master"; then
              action=skip; why="$SRC_SHA is not an ancestor of master ($master)"
            elif ! git diff --quiet "$SRC_SHA" "$master" -- web design .github/workflows/web-dist-sync.yml; then
              # Master moved and the bundle's inputs changed: the push that moved it
              # runs its own sync, and proposing this older build could revert it.
              action=skip; why="master moved on and changed the bundle's inputs; a newer run covers it"
            fi
          fi
          {
            echo "action=$action"
            echo "base=$base"
            echo "current=$([ "$SRC_SHA" = "$master" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          if [ "$action" = skip ]; then
            echo "Skipped: $why." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Use current master's tree
        if: steps.base.outputs.action == 'propose'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: git checkout -q --detach "$BASE"

      - name: Download the rebuilt bundle (untrusted data)
        if: steps.base.outputs.action == 'propose' && needs.build.outputs.changed == 'true'
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: ${{ runner.temp }}/dist-in

      - name: Validate the bundle shape
        if: steps.base.outputs.action == 'propose' && needs.build.outputs.changed == 'true'
        run: .github/scripts/web-dist-guard.sh "$RUNNER_TEMP/dist-in"

      - name: Commit and push the bot branch
        if: steps.base.outputs.action == 'propose' && needs.build.outputs.changed == 'true'
        env:
          WEB_DIST_SYNC_TOKEN: ${{ secrets.WEB_DIST_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Captain Claude'
          git config user.email 'noreply@anthropic.com'
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null

          git switch -q -c "$BRANCH"
          have_remote=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            have_remote=true
            # Keep the branch a fast-forward of its old tip without taking any of
            # its content: -s ours keeps master's tree, the dist is replaced below.
            git fetch -q --depth=1 origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git merge -q -s ours --allow-unrelated-histories --no-edit \
              -m "Merge previous $BRANCH tip" "refs/remotes/origin/$BRANCH"
          fi

          rm -rf web/dist
          cp -R "$RUNNER_TEMP/dist-in" web/dist
          git add -A -- web/dist
          tree="$(git write-tree)"

          # Nothing outside web/dist may differ from current master.
          if ! git diff --quiet origin/master "$tree" -- . ':(exclude)web/dist'; then
            echo "::error::the staged tree differs from master outside web/dist/" >&2
            git diff --name-only origin/master "$tree" -- . ':(exclude)web/dist' >&2
            exit 1
          fi
          if git diff --quiet origin/master "$tree"; then
            echo "The bundle already matches master; nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Compare the web/dist SUBTREE only. The open PR's tip may already hold this
          # exact bundle atop an older master (a scheduled or repeated run); a pushed
          # commit would only restart its checks.
          if [ "$have_remote" = true ] \
            && [ "$(git rev-parse "refs/remotes/origin/$BRANCH:web/dist")" = "$(git rev-parse "$tree:web/dist")" ]; then
            echo "The $BRANCH tip already holds this bundle; not pushing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -F - <<MSG
          chore(web): sync web/dist with web/src at ${SRC_SHA:0:10}

          Generated by .github/workflows/web-dist-sync.yml (#6447). Do not edit by
          hand: the Web job rebuilds this bundle from the PR's own source and fails
          on any byte that differs.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          MSG

          # The credential reaches git through the environment of this one command,
          # as an HTTP header; nothing is written to the repo config or the disk.
          basic="$(printf 'x-access-token:%s' "$WEB_DIST_SYNC_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $basic" \
            git push origin "$BRANCH"

      - name: Open or update the PR
        if: steps.base.outputs.action == 'propose' && needs.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEB_DIST_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # Nothing was pushed (bundle already matches, or the tip holds it): leave
          # any open PR alone.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            exit 0
          fi
          title="chore(web): sync web/dist with web/src (${SRC_SHA:0:10})"
          printf '%s\n' \
            "Generated by \`.github/workflows/web-dist-sync.yml\` (#6447): the committed \`web/dist\` bundle rebuilt from \`web/src\` at \`$SRC_SHA\`." \
            "" \
            "Dist-only. The Web job rebuilds the bundle from this PR's own tree and fails if it is not byte-identical, so a bundle that does not match the source cannot merge." \
            "" \
            "🤖 Generated with [Claude Code](https://claude.com/claude-code)" >body.md
          n="$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
          if [ -z "$n" ]; then
            url="$(gh pr create --repo "$REPO" --head "$BRANCH" --base master --title "$title" --body-file body.md)"
            n="${url##*/}"
          else
            gh api -X PATCH "repos/$REPO/pulls/$n" -f title="$title" -F body=@body.md >/dev/null
          fi
          # `gh pr edit --add-label` fails on this repo (Projects classic); REST works.
          gh api -X POST "repos/$REPO/issues/$n/labels" -f 'labels[]=fix-master' >/dev/null
          echo "web/dist sync PR: #$n (source $SRC_SHA)" >> "$GITHUB_STEP_SUMMARY"

      # The bundle already matches the CURRENT master: an open sync PR is obsolete.
      # (Never from a superseded run: its view of master is old.)
      - name: Close an obsolete sync PR
        if: steps.base.outputs.current == 'true' && needs.build.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.WEB_DIST_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          n="$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
          if [ -z "$n" ]; then
            echo "web/dist matches web/src; no sync PR open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr close "$n" --repo "$REPO" --delete-branch \
            --comment "web/dist already matches a fresh build of web/src at \`$SRC_SHA\`; closing. — web-dist-sync"
          echo "Closed obsolete sync PR #$n." >> "$GITHUB_STEP_SUMMARY"
