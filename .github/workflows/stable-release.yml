name: Stable Release

# Manually cuts a stable release vX.Y.Z off master. The maintainer picks the
# version (which digit to bump); previews then automatically rebase onto it
# as vX.Y.(Z+1)-preview-N. See docs/dev/release-process.md (#1041).
#
# Job order is deliberate: validate and build are read-only, and every
# mutation (the main.go bump commit, then tag + release, which are created
# together) happens in the final job only after all four artifacts exist — a
# failed preflight or build must never leave a dangling commit or tag on
# master, and a failure mid-publish must never leave a tag with no release
# (#5159). All jobs pin github.sha so a master push racing the workflow cannot
# desync what was validated, what was built, and what gets tagged. The
# artifacts are built from github.sha while the tag points at the bump commit
# one ahead; the binaries are identical in behavior because their version
# comes from -ldflags, and the bump commit only rewrites the main.go fallback
# string.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release, no leading v (e.g. 1.1.0)'
        required: true
        type: string

# One run at a time, never cancelled: two dispatches can share a version, and
# cancelling mid-publish is exactly how drafts and tags get stranded (#5159).
concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate version and preflight
    # Pinned to 24.04 until #6281 (26.04 compatibility) lands.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    # Validate against tags that have a PUBLISHED release, not every ref on
    # origin (#5159): a tag stranded without its release must neither count
    # as the latest stable baseline nor block re-cutting the same version —
    # re-running it is how the stranded state gets healed.
    - name: Validate requested version
      env:
        NEW_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --paginate --jq '.[] | select(.draft == false) | .tag_name' | \
          .github/scripts/validate-stable-version.sh "$NEW_VERSION"

    # The preflight runs the full suite, and internal/shellsuggest FAILS rather
    # than skips when a shell it claims (sh/bash/zsh) is absent (#1978/#1988).
    # Without zsh the preflight cannot pass, so a release would be unable to cut.
    # Routed through scripts/ci-apt-install.sh so a third-party source in the
    # runner image cannot fail this step by failing the update (#3774) — a
    # release must not be blocked by a repository it never installs from.
    - name: Install zsh
      run: scripts/ci-apt-install.sh zsh

    # Test (macOS) is the only darwin test run and lives on master's pr.yml, which
    # the preflight below cannot see. Block on a known-red verdict (#5818).
    - name: Test (macOS) verdict on master
      uses: actions/github-script@v8
      with:
        script: |
          await require('./.github/scripts/macos-verdict.js').gateRelease({ github, core, context });

    - name: Release preflight
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::Unformatted files found:"
          echo "$unformatted"
          gofmt -d .
          exit 1
        fi
        go vet ./...
        # The daemon package took 468s of Go's default 600s per-package budget at
        # v1.0.287 and crossed it four days later, failing a release with a
        # timeout rather than a real defect. PR CI runs this same -race suite but
        # with -timeout 20m (pr.yml), so it could not see a 10m wall. The default
        # is Go's, not a considered budget for this suite. What the time is spent
        # on, measured from these logs, is in #4464.
        go test -v -race -count=1 -timeout=30m ./...
        go build ./...

  # web/dist is committed (web/embed.go embeds it) but, once WEB_DIST_SYNC is on, PRs no
  # longer carry it: web-dist-sync.yml lands it after the source (#6447). A tag must never
  # embed a bundle that lags web/src, so rebuild and fail on any difference. This runs
  # npm, which executes package scripts, so it is its OWN job: contents: read, no
  # persisted credential, no npm cache, and no workspace shared with the jobs that hold
  # contents: write or run `go ./...`. `build` needs it. The wait is minutes; the next
  # run picks the release up once the sync PR has merged.
  web-bundle:
    name: Committed web/dist is current
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Set up Node
      if: vars.WEB_DIST_SYNC == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Committed web/dist matches web/src
      if: vars.WEB_DIST_SYNC == 'true'
      run: |
        make web-build
        dirty="$(git status --porcelain -- web/dist)"
        if [ -n "$dirty" ]; then
          echo "::error::web/dist is stale: it does not match a fresh build of web/src, so a release would embed an old web client."
          echo "$dirty"
          echo "web-dist-sync.yml proposes the fix as a dist-only PR (branch web-dist-sync); release once it has merged."
          exit 1
        fi

  build:
    name: Build
    needs: [validate, web-bundle]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ inputs.version }}
      run: |
        ARCHIVE_NAME=agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}
        mkdir -p dist
        go build -v -ldflags "-X main.version=${VERSION}" -o dist/agent-factory
        cd dist
        tar czf ../${ARCHIVE_NAME}.tar.gz agent-factory

    # The sandbox/ssh transports STREAM an af release binary onto the remote
    # host and exec it there (#5571 W2.2). A remote linux host's libc is
    # whatever its image ships — musl, an older glibc, or none — so the
    # streamed binary is a separate CGO_ENABLED=0 build published alongside as
    # agent-factory-linux-<arch>-static.tar.gz. The installed artifacts stay
    # DYNAMIC on purpose: CGO off switches the daemon's own resolver to pure
    # Go, which cannot honour NSS hosts modules (mDNS/LDAP/SSSD ordered ahead
    # of DNS), and the ssh dial-pin would then pin a different address than
    # ssh resolves for the same name.
    #
    # Stamped with the release version exactly like the installed build above.
    # VERSION is per step, and an unset one stamps "" — the binary then falls
    # back to reporting "dev" and exits 0, which is how these archives shipped
    # unstamped (#5666).
    - name: Build the static sandbox-host binary
      if: matrix.goos == 'linux'
      env:
        GOOS: linux
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
        VERSION: ${{ inputs.version }}
      run: |
        ARCHIVE_NAME=agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}-static
        mkdir -p dist-static
        go build -v -ldflags "-X main.version=${VERSION}" -o dist-static/agent-factory
        cd dist-static
        tar czf ../${ARCHIVE_NAME}.tar.gz agent-factory

    # The daemon untars this archive onto a sandbox host and runs `af version`
    # there — do exactly that against the just-built artifact so a binary that
    # cannot execute on a bare host fails here, not on a user's machine. Both
    # linux legs must be statically linked; only the native amd64 leg can also
    # exec it for `version`, and that run must print the RELEASE version, not
    # merely exit 0 — an unstamped build prints "dev" and exits 0 (#5666). The
    # arm64 leg is this same step on another GOARCH, so that it is stamped is
    # pinned by scripts/release_version_stamp_test.go rather than executed.
    - name: Smoke-test the static sandbox-host artifact
      if: matrix.goos == 'linux'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        tmp="$(mktemp -d)"
        tar xzf "agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}-static.tar.gz" -C "$tmp"
        file "$tmp/agent-factory" | grep -q "statically linked"
        if [ "${{ matrix.goarch }}" = amd64 ]; then
          .github/scripts/assert-binary-version.sh "$tmp/agent-factory" "$VERSION"
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          agent-factory-${{ matrix.goos }}-${{ matrix.goarch }}-static.tar.gz
        if-no-files-found: warn
        retention-days: 1

  publish:
    name: Bump and publish
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
    # Full history is required: release-bump.sh rebases the bump commit onto
    # whatever master became during the build (#1927), and a rebase has no
    # merge-base to find in a one-commit checkout.
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

    # Fetch the artifacts before touching git so a failed download cannot
    # leave a pushed commit or tag with no release behind it.
    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    - name: Generate checksum manifest
      run: .github/scripts/write-sha256sums.sh dist

    # Lands the bump commit on master and reports the sha that actually
    # landed (the rebase-retry may rewrite it) — that sha is what the release
    # tags. Failure here leaves at most an untagged bump commit.
    - name: Bump version and push to master
      id: bump
      env:
        NEW_VERSION: ${{ inputs.version }}
      run: |
        .github/scripts/release-bump.sh "$NEW_VERSION"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Immutable releases require all assets to be attached before the release
    # is published: create as draft, upload assets into the draft, then
    # publish. A draft creates no git ref; publishing creates the tag at the
    # landed bump commit atomically with the release (#5159). Stable releases
    # are marked --latest so the releases/latest redirect (install.sh, fresh
    # installs, the stable update channel) serves them.
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        GH_REPO: ${{ github.repository }}
        TARGET: ${{ steps.bump.outputs.sha }}
      run: |
        .github/scripts/release-forget-version.sh "$VERSION"
        gh release create "v${VERSION}" \
          --title "v${VERSION}" \
          --target "$TARGET" \
          --generate-notes \
          --draft \
          dist/*.tar.gz \
          dist/sha256sums.txt
        gh release edit "v${VERSION}" --draft=false --latest

    # A cancelled job runs no cleanup, so self-healing lives in the pre-create
    # forget above; this step covers an ordinary failure mid-publish leaving
    # a draft behind.
    - name: Forget the version on failure
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        GH_REPO: ${{ github.repository }}
      run: .github/scripts/release-forget-version.sh "$VERSION"
