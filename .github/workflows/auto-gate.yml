name: Auto Gate

on:
  # These events cover every input read by evaluate(): required checks,
  # reviews/findings, labels, base, draft/state, head, and native auto-merge.
  # Repository-ruleset changes and mergeability changes caused only by master
  # advancing are not evented here. workflow_dispatch repairs stale
  # observational state, and this is safe for Auto Gate because merge() always
  # performs a fresh full evaluation immediately before its destructive write.
  check_suite:
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
  pull_request_review_comment:
    types: [created, edited, deleted]
  # A writable base-repository context is required to invalidate a stale
  # aggregate when a fork PR appears. Every checkout below is pinned to the
  # default branch; this workflow never checks out or executes pull-request code.
  pull_request_target:
    types: [opened, reopened, closed, synchronize, edited, converted_to_draft, ready_for_review, labeled, unlabeled, auto_merge_enabled, auto_merge_disabled]
  status:
  # GitHub suppresses check_suite recursion for Actions-owned suites. The
  # required Lint and Build checks both belong to PR Validation, so its terminal
  # workflow_run is the non-recursive wakeup that republishes their final state.
  workflow_run:
    workflows: [PR Validation]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  statuses: read
  issues: write

jobs:
  auto-gate:
    name: Evaluate auto-merge gate
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.evaluate.outputs.targets }}
      aggregate_heads: ${{ steps.evaluate.outputs.aggregate_heads }}
    # One resolver handles every subscribed input change. It does not branch on
    # activity type: PR/review/comment events identify a PR, while check/status/
    # workflow-run events identify every exact (PR, head) pair at their SHA.
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate gate
        id: evaluate
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");

            if (!fs.existsSync(helperPath)) {
              const summary = "BLOCKED: auto-gate helper is not present on the default branch yet.";
              core.notice(summary);
              core.setOutput("targets", "[]");
              core.setOutput("aggregate_heads", "[]");
              if (context.eventName === "workflow_dispatch") {
                throw new Error(summary);
              }
              return;
            }

            // Preserve heads carried by the webhook before any API-dependent
            // resolution. If the resolver fails, apply-gate can still make a
            // previously green aggregate non-green for every known head.
            const payload = context.payload || {};
            // Order is safety-critical because invalidation is sequential: the
            // current/after head must turn red before the historical before head.
            const knownEventHeads = [...new Set([
              payload.pull_request?.head?.sha,
              payload.after,
              payload.check_suite?.head_sha,
              payload.workflow_run?.head_sha,
              payload.sha,
              payload.before,
            ]
              .map((value) => String(value || "").toLowerCase())
              .filter((value) => /^[0-9a-f]{40}$/.test(value)))];

            let autoGate;
            try {
              autoGate = require(helperPath);
              const rawPrNumber = process.env.PR_NUMBER.trim();
              const explicitPrNumber = rawPrNumber ? Number(rawPrNumber) : undefined;
              if (
                rawPrNumber &&
                (!Number.isSafeInteger(explicitPrNumber) || explicitPrNumber <= 0)
              ) {
                throw new Error(`Invalid PR number: ${rawPrNumber}`);
              }
              let targets;
              if (typeof autoGate.resolveTargets === "function") {
                targets = await autoGate.resolveTargets({
                  github,
                  context,
                  core,
                  prNumber: explicitPrNumber,
                });
              } else {
                // The workflow file takes effect before its default-branch helper
                // on the landing run. Preserve one-target behavior for that run.
                const result = await autoGate.evaluate({
                  github,
                  context,
                  core,
                  prNumber: explicitPrNumber,
                });
                const evaluationFailed = result.reasons.some((reason) =>
                  reason.startsWith("auto-gate evaluation error:"),
                );
                if (evaluationFailed) {
                  const failure = new Error(result.summary);
                  failure.failWorkflow = true;
                  failure.autoGateReadFailure = result.readFailure === true;
                  throw failure;
                }
                targets = result.headSha
                  ? [{
                      prNumber: result.prNumber,
                      headSha: result.headSha,
                      decisionKey: `pr-${result.prNumber}-head-${result.headSha}`,
                    }]
                  : [];
              }
              core.setOutput(
                "targets",
                JSON.stringify(
                  targets.map((target) => ({
                    pr_number: target.prNumber,
                    head_sha: target.headSha,
                    decision_key: target.decisionKey,
                  })),
                ),
              );
              const aggregateHeads =
                typeof autoGate.resolveAggregateHeads === "function"
                  ? autoGate.resolveAggregateHeads({ context, targets })
                  : [...new Set(targets.map((target) => target.headSha))];
              core.setOutput(
                "aggregate_heads",
                JSON.stringify(aggregateHeads.map((headSha) => ({ head_sha: headSha }))),
              );
              if (context.eventName === "workflow_dispatch" && targets.length === 0) {
                const failure = new Error("No pull-request head was resolved for manual recovery.");
                failure.failWorkflow = true;
                throw failure;
              }
            } catch (error) {
              const message = error && error.message ? error.message : String(error);
              const summary = `BLOCKED: auto-gate evaluation error: ${message}`;
              const readFailure = autoGate?.isReadFailure?.(error) === true;
              core.warning(readFailure ? message : error && error.stack ? error.stack : message);
              core.notice(summary);
              core.setOutput("targets", "[]");
              core.setOutput(
                "aggregate_heads",
                JSON.stringify(
                  knownEventHeads.map((headSha) => ({
                    head_sha: headSha,
                    read_failure: readFailure ? summary : "",
                  })),
                ),
              );
              // A retry-exhausted read is already represented by a BLOCKED
              // verdict. Let invalidation/apply publish that red decision;
              // rethrowing here discards the actionable terminal outcome.
              if (readFailure) {
                core.setFailed(summary);
                return;
              }
              throw error;
            }

  invalidate-gate:
    name: Invalidate aggregate
    needs: auto-gate
    outputs:
      invalidated_heads: ${{ steps.invalidate.outputs.invalidated_heads }}
    if: >-
      always() &&
      needs.auto-gate.outputs.aggregate_heads != '' &&
      needs.auto-gate.outputs.aggregate_heads != '[]'
    runs-on: ubuntu-latest
    # These writes deliberately happen before the per-head serialized lanes. A
    # newer event must turn each required check red while an older transaction
    # is still running; generation fencing prevents that older run from
    # overwriting it. A failed invalidation is retried before any serialized lane
    # wait; only heads with a confirmed newer generation enter that lane, while one
    # old-head failure cannot suppress a healthy current head.
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Make the aggregate non-green immediately
        id: invalidate
        uses: actions/github-script@v8
        env:
          AGGREGATE_HEADS: ${{ needs.auto-gate.outputs.aggregate_heads }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            const aggregateHeads = JSON.parse(process.env.AGGREGATE_HEADS || "[]");
            if (typeof autoGate.invalidateAggregateDecision !== "function") {
              core.notice("Landing compatibility: fixed aggregate invalidation starts on master.");
              core.setOutput("invalidated_heads", JSON.stringify(aggregateHeads));
              return;
            }
            const invalidateAggregate = async (aggregate) => {
              const headSha = String(aggregate.head_sha || "");
              const invalidated = await autoGate.invalidateAggregateDecision({
                github,
                context,
                core,
                headSha,
              });
              if (invalidated.writeState === "read-only") {
                throw new Error(`Could not invalidate aggregate ${headSha}.`);
              }
            };
            const invalidatedHeads = [];
            const failures = [];
            for (const aggregate of aggregateHeads) {
              const headSha = String(aggregate.head_sha || "");
              try {
                await invalidateAggregate(aggregate);
              } catch (initialError) {
                core.warning(
                  `Initial invalidation failed for ${headSha}; retrying before the serialized lane: ${initialError.message || String(initialError)}`,
                );
                try {
                  await invalidateAggregate(aggregate);
                } catch (retryError) {
                  failures.push(
                    new AggregateError(
                      [initialError, retryError],
                      `Could not invalidate aggregate ${headSha} before the serialized lane`,
                    ),
                  );
                  core.warning(
                    `Could not invalidate aggregate ${headSha} after the pre-lane retry: ${retryError.message || String(retryError)}`,
                  );
                  continue;
                }
              }
              invalidatedHeads.push(aggregate);
            }
            core.setOutput("invalidated_heads", JSON.stringify(invalidatedHeads));
            if (failures.length > 0) {
              throw new AggregateError(
                failures,
                `${failures.length} aggregate invalidation(s) failed after the pre-lane retry`,
              );
            }

  apply-gate:
    name: Apply aggregate gate
    needs: [auto-gate, invalidate-gate]
    # Keep always() so successfully fenced heads proceed even if another candidate
    # exhausts its pre-lane retry. An unfenced head is deliberately absent: it must
    # not wait behind an older transaction that can still publish PASS.
    if: >-
      always() &&
      needs.invalidate-gate.outputs.invalidated_heads != '' &&
      needs.invalidate-gate.outputs.invalidated_heads != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aggregate: ${{ fromJSON(needs.invalidate-gate.outputs.invalidated_heads) }}
    # Refresh/report/merge owns one lane. The preceding unqueued invalidation is
    # a distinct generation; an older transaction refuses to overwrite it.
    concurrency:
      group: auto-gate-aggregate-${{ matrix.aggregate.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate, report, and merge the serialized head
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ matrix.aggregate.head_sha }}
          TARGETS_JSON: ${{ needs.auto-gate.outputs.targets }}
          MERGE_ENABLED: ${{ vars.AUTO_GATE_ENABLED }}
          READ_FAILURE: ${{ matrix.aggregate.read_failure || '' }}
        with:
          # The built-in Actions identity owns both decision layers and has no
          # ruleset bypass. The fixed aggregate is the enforcement boundary.
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            const targets = JSON.parse(process.env.TARGETS_JSON || "[]");
            const aggregateExternalId =
              `auto-gate:aggregate:head:${String(process.env.HEAD_SHA || "").toLowerCase()}`;
            let ownedAggregateCheck = null;
            // Keep the merge write single-shot. The wrappers only remember this
            // transaction's aggregate generation and classify a refused response.
            const concede = (message, cause, reason) => {
              core.notice(message);
              const concession = new Error(message, { cause });
              concession.autoGateMergeConceded = true;
              // The helper's reason decides whether the transaction may still
              // write to the aggregate on its way out (#3551).
              concession.autoGateConcessionReason = reason;
              throw concession;
            };
            const createCheck = github.rest.checks.create.bind(github.rest.checks);
            github.rest.checks.create = async (options) => {
              const response = await createCheck(options);
              if (options.external_id === aggregateExternalId) {
                ownedAggregateCheck = response.data;
              }
              return response;
            };
            const updateCheck = github.rest.checks.update.bind(github.rest.checks);
            github.rest.checks.update = async (options) => {
              const response = await updateCheck(options);
              if (options.output?.title === "PASS: every open master PR at this commit passes Auto Gate") {
                ownedAggregateCheck = response.data;
              }
              return response;
            };
            const mergePull = github.rest.pulls.merge.bind(github.rest.pulls);
            github.rest.pulls.merge = async (options) => {
              try {
                return await mergePull(options);
              } catch (error) {
                // The conceded refusal shapes and the evidence each one demands
                // live in the helper, where they are tested (#3434). A refusal
                // with no proven winner returns "" and stays loud.
                const concession =
                  typeof autoGate.resolveMergeRefusal === "function"
                    ? await autoGate.resolveMergeRefusal({
                        github,
                        error,
                        options,
                        ownedAggregateCheck,
                      })
                    : null;
                if (concession) {
                  concede(concession.message, error, concession.reason);
                }
                throw error;
              }
            };
            if (typeof autoGate.processAggregateHead === "function") {
              try {
                await autoGate.processAggregateHead({
                  github,
                  context,
                  core,
                  headSha: process.env.HEAD_SHA,
                  targets: targets.map((target) => ({
                    prNumber: Number(target.pr_number),
                    headSha: target.head_sha,
                  })),
                  mergeEnabled: process.env.MERGE_ENABLED === "true",
                  manual: context.eventName === "workflow_dispatch",
                  readFailureReason: process.env.READ_FAILURE,
                });
              } catch (error) {
                if (!error?.autoGateMergeConceded) throw error;
              }
              return;
            }
            // Landing compatibility: this workflow is visible before the new
            // default-branch helper. Keep the prior one-target behavior for
            // that single run; fixed aggregate enforcement starts on master.
            for (const target of targets.filter((item) => item.head_sha === process.env.HEAD_SHA)) {
              const result = await autoGate.evaluate({
                github,
                context,
                core,
                prNumber: Number(target.pr_number),
                setOutputs: false,
              });
              if (result.reasons.some((reason) => reason.startsWith("auto-gate evaluation error:"))) {
                throw new Error(result.summary);
              }
              if (result.headSha !== process.env.HEAD_SHA) {
                core.notice(`Skipping stale landing target PR #${target.pr_number}.`);
                continue;
              }
              if (typeof autoGate.reportDecision === "function") {
                await autoGate.reportDecision({
                  github,
                  context,
                  core,
                  result,
                  manual: context.eventName === "workflow_dispatch",
                });
              }
              if (!result.shouldMerge) {
                continue;
              }
              if (process.env.MERGE_ENABLED !== "true") {
                core.notice(`AUTO_GATE_ENABLED is not true; would merge PR #${target.pr_number}.`);
                continue;
              }
              try {
                await autoGate.merge({
                  github,
                  context,
                  core,
                  prNumber: Number(target.pr_number),
                  expectedHeadSha: process.env.HEAD_SHA,
                });
              } catch (error) {
                if (error?.autoGateMergeConceded) return;
                throw error;
              }
            }
