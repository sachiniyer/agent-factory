name: Auto Gate

on:
  # These events cover every input read by evaluate(): required checks,
  # reviews/findings, labels, base, draft/state, and head. Repository-ruleset
  # changes and mergeability changes caused only by master advancing are not
  # evented here. workflow_dispatch repairs stale observational state, and this
  # is safe for Auto Gate because merge() always performs a fresh full
  # evaluation immediately before its destructive write.
  check_suite:
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, reopened, closed, synchronize, edited, converted_to_draft, ready_for_review, labeled, unlabeled]
  status:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  statuses: read
  issues: write

jobs:
  auto-gate:
    name: Evaluate auto-merge gate
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.evaluate.outputs.targets }}
      aggregate_heads: ${{ steps.evaluate.outputs.aggregate_heads }}
    # One resolver handles every subscribed input change. It does not branch on
    # activity type: PR/review/comment events identify a PR, while check/status
    # events identify every exact (PR, head) pair associated with their SHA.
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate gate
        id: evaluate
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");

            if (!fs.existsSync(helperPath)) {
              const summary = "BLOCKED: auto-gate helper is not present on the default branch yet.";
              core.notice(summary);
              core.setOutput("targets", "[]");
              core.setOutput("aggregate_heads", "[]");
              if (context.eventName === "workflow_dispatch") {
                throw new Error(summary);
              }
              return;
            }

            try {
              const autoGate = require(helperPath);
              const rawPrNumber = process.env.PR_NUMBER.trim();
              const explicitPrNumber = rawPrNumber ? Number(rawPrNumber) : undefined;
              if (
                rawPrNumber &&
                (!Number.isSafeInteger(explicitPrNumber) || explicitPrNumber <= 0)
              ) {
                throw new Error(`Invalid PR number: ${rawPrNumber}`);
              }
              let targets;
              if (typeof autoGate.resolveTargets === "function") {
                targets = await autoGate.resolveTargets({
                  github,
                  context,
                  core,
                  prNumber: explicitPrNumber,
                });
              } else {
                // The workflow file takes effect before its default-branch helper
                // on the landing run. Preserve one-target behavior for that run.
                const result = await autoGate.evaluate({
                  github,
                  context,
                  core,
                  prNumber: explicitPrNumber,
                });
                const evaluationFailed = result.reasons.some((reason) =>
                  reason.startsWith("auto-gate evaluation error:"),
                );
                if (evaluationFailed) {
                  const failure = new Error(result.summary);
                  failure.failWorkflow = true;
                  throw failure;
                }
                targets = result.headSha
                  ? [{
                      prNumber: result.prNumber,
                      headSha: result.headSha,
                      decisionKey: `pr-${result.prNumber}-head-${result.headSha}`,
                    }]
                  : [];
              }
              core.setOutput(
                "targets",
                JSON.stringify(
                  targets.map((target) => ({
                    pr_number: target.prNumber,
                    head_sha: target.headSha,
                    decision_key: target.decisionKey,
                  })),
                ),
              );
              const aggregateHeads =
                typeof autoGate.resolveAggregateHeads === "function"
                  ? autoGate.resolveAggregateHeads({ context, targets })
                  : [...new Set(targets.map((target) => target.headSha))];
              core.setOutput(
                "aggregate_heads",
                JSON.stringify(aggregateHeads.map((headSha) => ({ head_sha: headSha }))),
              );
              if (context.eventName === "workflow_dispatch" && targets.length === 0) {
                const failure = new Error("No pull-request head was resolved for manual recovery.");
                failure.failWorkflow = true;
                throw failure;
              }
            } catch (error) {
              const message = error && error.message ? error.message : String(error);
              const summary = `BLOCKED: auto-gate evaluation error: ${message}`;
              core.warning(error && error.stack ? error.stack : message);
              core.notice(summary);
              core.setOutput("targets", "[]");
              core.setOutput("aggregate_heads", "[]");
              throw error;
            }

  begin-aggregate:
    name: Make aggregate decision non-green
    needs: auto-gate
    if: >-
      needs.auto-gate.result == 'success' &&
      needs.auto-gate.outputs.aggregate_heads != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aggregate: ${{ fromJSON(needs.auto-gate.outputs.aggregate_heads) }}
    concurrency:
      group: auto-gate-aggregate-${{ matrix.aggregate.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Make fixed-name aggregate non-green
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ matrix.aggregate.head_sha }}
        with:
          # The aggregate is intentionally owned by the built-in Actions app.
          # No PAT or bypass-capable App identity is needed or accepted here.
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            if (typeof autoGate.beginAggregateDecision !== "function") {
              core.notice("Fixed-name aggregate activation waits for this workflow to land on master.");
              return;
            }
            await autoGate.beginAggregateDecision({
              github,
              context,
              core,
              headSha: process.env.HEAD_SHA,
            });

  apply-gate:
    name: Apply auto-merge gate
    needs: [auto-gate, begin-aggregate]
    if: >-
      needs.auto-gate.result == 'success' &&
      needs.begin-aggregate.result == 'success' &&
      needs.auto-gate.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.auto-gate.outputs.targets) }}
    # Decision identity is the pair, never the commit alone. Two PRs may point
    # at the same commit without sharing a check or serialization lane.
    concurrency:
      group: auto-gate-${{ matrix.target.decision_key }}
      cancel-in-progress: false
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Report gate decision
        id: decision
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ matrix.target.pr_number }}
          EXPECTED_HEAD_SHA: ${{ matrix.target.head_sha }}
        with:
          # Check runs require an App installation token. The built-in Actions
          # identity owns both the composite and the fixed aggregate.
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            const result = await autoGate.evaluate({
              github,
              context,
              core,
              prNumber: Number(process.env.PR_NUMBER),
              setOutputs: false,
            });
            if (!result.headSha) {
              throw new Error(result.summary);
            }
            if (result.headSha !== process.env.EXPECTED_HEAD_SHA) {
              core.notice(
                `Skipping stale target for PR #${process.env.PR_NUMBER}: serialized head ` +
                  `${process.env.EXPECTED_HEAD_SHA}, current head ${result.headSha}.`,
              );
              core.setOutput("should_merge", "false");
              core.setOutput("docs_changed", "false");
              core.setOutput("summary", "BLOCKED: pull-request head changed before serialized evaluation");
              return;
            }
            core.setOutput("pr_number", result.prNumber);
            core.setOutput("should_merge", result.shouldMerge ? "true" : "false");
            core.setOutput("head_sha", result.headSha);
            core.setOutput("docs_changed", result.docsChanged ? "true" : "false");
            core.setOutput("summary", result.summary);
            if (typeof autoGate.reportDecision === "function") {
              await autoGate.reportDecision({
                github,
                context,
                core,
                result,
                manual: context.eventName === "workflow_dispatch",
              });
            } else {
              core.notice("Decision reporting activates after this workflow lands on master.");
            }

  aggregate-gate:
    name: Publish aggregate decision
    needs: [auto-gate, begin-aggregate, apply-gate]
    if: >-
      always() &&
      needs.auto-gate.result == 'success' &&
      needs.begin-aggregate.result == 'success' &&
      (needs.apply-gate.result == 'success' || needs.auto-gate.outputs.targets == '[]') &&
      needs.auto-gate.outputs.aggregate_heads != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aggregate: ${{ fromJSON(needs.auto-gate.outputs.aggregate_heads) }}
    concurrency:
      group: auto-gate-aggregate-${{ matrix.aggregate.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish fixed-name aggregate
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ matrix.aggregate.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            if (typeof autoGate.reportAggregateDecision !== "function") {
              core.notice("Fixed-name aggregate activation waits for this workflow to land on master.");
              return;
            }
            await autoGate.reportAggregateDecision({
              github,
              context,
              core,
              headSha: process.env.HEAD_SHA,
            });

  merge-gate:
    name: Merge after aggregate gate
    needs: [auto-gate, begin-aggregate, apply-gate, aggregate-gate]
    if: >-
      needs.auto-gate.result == 'success' &&
      needs.begin-aggregate.result == 'success' &&
      needs.apply-gate.result == 'success' &&
      needs.aggregate-gate.result == 'success' &&
      needs.auto-gate.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.auto-gate.outputs.targets) }}
    concurrency:
      group: auto-gate-${{ matrix.target.decision_key }}
      cancel-in-progress: false
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Report disabled merge
        if: vars.AUTO_GATE_ENABLED != 'true'
        env:
          PR_NUMBER: ${{ matrix.target.pr_number }}
        run: |
          echo "::notice::AUTO_GATE_ENABLED is not true; would reevaluate and squash-merge PR #${PR_NUMBER}."

      - name: Squash merge PR after fresh aggregate evaluation
        if: vars.AUTO_GATE_ENABLED == 'true'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ matrix.target.pr_number }}
          EXPECTED_HEAD_SHA: ${{ matrix.target.head_sha }}
        with:
          # No PAT or custom App: ordinary ruleset enforcement applies to this
          # merge exactly as it does to a session's direct merge attempt.
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            if (typeof autoGate.evaluateAggregateDecision !== "function") {
              core.notice("Aggregate enforcement activates after this workflow lands on master.");
            }
            try {
              await autoGate.merge({
                github,
                context,
                core,
                prNumber: Number(process.env.PR_NUMBER),
                expectedHeadSha: process.env.EXPECTED_HEAD_SHA,
              });
            } catch (error) {
              const message = error && error.message ? error.message : String(error);
              const expectedPrefix = `Refusing to merge PR #${process.env.PR_NUMBER};`;
              if (!message.startsWith(expectedPrefix)) {
                throw error;
              }
              // A fresh gate refusal is ordinary waiting state. The fixed
              // aggregate remains the red enforcement record; infrastructure
              // and merge API errors still fail this workflow job.
              core.notice(message);
            }
