name: Auto Gate

on:
  # These events cover every input read by evaluate(): required checks,
  # reviews/findings, labels, base, draft/state, head, and native auto-merge.
  # Repository-ruleset changes and mergeability changes caused only by master
  # advancing are not evented here. workflow_dispatch repairs stale
  # observational state, and this is safe for Auto Gate because merge() always
  # performs a fresh full evaluation immediately before its destructive write.
  check_suite:
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
  pull_request_review_comment:
    types: [created, edited, deleted]
  # A writable base-repository context is required to invalidate a stale
  # aggregate when a fork PR appears. Every checkout below is pinned to the
  # default branch; this workflow never checks out or executes pull-request code.
  #
  # opened and synchronize are NOT here: auto-gate-head.yml subscribes to them
  # and calls this workflow, so the jobs, payload, and concurrency keys are
  # unchanged. The split is about check-suite placement (#4802). GitHub files
  # the aggregate in the earliest github-actions suite on a head, and the
  # push-time Auto Gate suite sometimes wins that race. When it did, a later
  # labeled/edited run of this same workflow on the same head superseded it,
  # and the ruleset stopped counting the PASS for good. auto-gate-head.yml gets
  # one suite per head, and the actions below all fire after the push-time
  # suites exist, so none of them is the placement or can supersede it.
  pull_request_target:
    types: [reopened, closed, edited, converted_to_draft, ready_for_review, labeled, unlabeled, auto_merge_enabled, auto_merge_disabled]
  # auto-gate-head.yml's opened/synchronize runs. github.event_name and the
  # payload in a called workflow are the caller's, so every expression below
  # sees the same pull_request_target event it saw before the split.
  workflow_call:
  status:
  # GitHub suppresses check_suite recursion for Actions-owned suites. The
  # required Lint and Build checks both belong to PR Validation, so its terminal
  # workflow_run is the non-recursive wakeup that republishes their final state.
  workflow_run:
    workflows: [PR Validation]
    types: [completed]
  # GitHub has intermittently omitted that terminal workflow_run event. Reconcile
  # only stale decisions that name a PR Validation blocker; one paginated query
  # batches PR heads/check rollups and at most ten reevaluations start (#4242).
  # GitHub delivers this schedule every two to five hours, not every five minutes
  # (#4571), so it is only the backstop. Every other run requests the same pass as
  # the repository_dispatch below, at most once per five minutes. A pass never
  # requests another.
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [auto-gate-reconcile]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number
      previous_head_sha:
        description: Initiating head that an update-branch recovery must wait to move past
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  statuses: read
  issues: write

# A concurrency group holds one running and one pending run: a newer pending
# run replaces the older one, and cancel-in-progress stays false so an active
# transaction always finishes uninterrupted. Replacement is safe only when the
# survivor's invalidation covers every head the cancelled pending run would
# have covered — a run cancelled while pending never reaches the ungrouped
# invalidation below, and an uncovered head keeps its stale verdict. Each group
# is keyed so that guarantee holds:
#
# - schedule / repository_dispatch: every reconciliation pass scans every open
#   master PR, so pending copies are fungible and the older one carries nothing
#   the newer one misses. Keeping the active pass alive through its aggregate
#   transaction also keeps the next scan from selecting the same per-PR
#   decisions while they are queued (#4571).
# - workflow_dispatch: keyed by (pr_number, previous_head_sha). Recovery polls
#   for the head AFTER that one; only an identical request reproduces it.
# - pull_request_target synchronize: keyed by (before, after). It alone carries
#   the previous head, which no later event reproduces, so only a redelivery of
#   the same transition may replace it — never a different push or a comment.
# - pull_request_target other actions: keyed by (PR, payload head). A head can
#   move while a PR is closed with no synchronize event bridging it, so closed
#   on the old head must not be replaced by reopened on the new one.
# - issue_comment / pull_request_review / pull_request_review_comment: one
#   group per PR. They cover only the PR's current head, resolved at run time,
#   and every transition away from an older head is carried by a synchronize
#   run that never coalesces — so a burst of comments collapses to at most one
#   pending run and loses no invalidation.
# - check_suite / status / workflow_run: one group per named commit. Coverage
#   is exactly that head, so same-commit copies are identical by construction.
concurrency:
  group: >-
    auto-gate-${{
      (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'required-check-reconciliation' ||
      github.event_name == 'workflow_dispatch' && format('recovery-{0}-{1}', inputs.pr_number, inputs.previous_head_sha) ||
      github.event_name == 'pull_request_target' && github.event.action == 'synchronize' && format('synchronize-{0}-{1}', github.event.before, github.event.after) ||
      github.event_name == 'pull_request_target' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) ||
      (github.event.issue.number || github.event.pull_request.number) && format('pr-{0}', github.event.issue.number || github.event.pull_request.number) ||
      (github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.event.sha) && format('head-{0}', github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.event.sha) ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  auto-gate:
    name: Resolve event heads
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.evaluate.outputs.targets }}
      aggregate_heads: ${{ steps.evaluate.outputs.aggregate_heads }}
      branch_sweep: ${{ steps.sweep.outputs.branch_sweep }}
    # One resolver handles every subscribed input change. It does not branch on
    # activity type: PR/review/comment events identify a PR, while check/status/
    # workflow-run events identify every exact (PR, head) pair at their SHA.
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate gate
        id: evaluate
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");

            if (!fs.existsSync(helperPath)) {
              const summary = "BLOCKED: auto-gate helper is not present on the default branch yet.";
              core.notice(summary);
              core.setOutput("targets", "[]");
              core.setOutput("aggregate_heads", "[]");
              if (context.eventName === "workflow_dispatch") {
                throw new Error(summary);
              }
              return;
            }

            // Preserve heads carried by the webhook before any API-dependent
            // resolution. If the resolver fails, apply-gate can still make a
            // previously green aggregate non-green for every known head.
            const payload = context.payload || {};
            // Order is safety-critical because invalidation is sequential: the
            // current/after head must turn red before the historical before head.
            const knownEventHeads = [...new Set([
              payload.pull_request?.head?.sha,
              payload.after,
              payload.check_suite?.head_sha,
              payload.workflow_run?.head_sha,
              payload.sha,
              payload.before,
            ]
              .map((value) => String(value || "").toLowerCase())
              .filter((value) => /^[0-9a-f]{40}$/.test(value)))];

            let autoGate;
            try {
              autoGate = require(helperPath);
              const rawPrNumber = process.env.PR_NUMBER.trim();
              const explicitPrNumber = rawPrNumber ? Number(rawPrNumber) : undefined;
              if (
                rawPrNumber &&
                (!Number.isSafeInteger(explicitPrNumber) || explicitPrNumber <= 0)
              ) {
                throw new Error(`Invalid PR number: ${rawPrNumber}`);
              }
              let targets;
              if (typeof autoGate.resolveTargets === "function") {
                targets = await autoGate.resolveTargets({
                  github,
                  context,
                  core,
                  prNumber: explicitPrNumber,
                });
              } else {
                // The workflow file takes effect before its default-branch helper
                // on the landing run. Preserve one-target behavior for that run.
                const result = await autoGate.evaluate({
                  github,
                  context,
                  core,
                  prNumber: explicitPrNumber,
                });
                const evaluationFailed = result.reasons.some((reason) =>
                  reason.startsWith("auto-gate evaluation error:"),
                );
                if (evaluationFailed) {
                  const failure = new Error(result.summary);
                  failure.failWorkflow = true;
                  failure.autoGateReadFailure = result.readFailure === true;
                  throw failure;
                }
                targets = result.headSha
                  ? [{
                      prNumber: result.prNumber,
                      headSha: result.headSha,
                      decisionKey: `pr-${result.prNumber}-head-${result.headSha}`,
                    }]
                  : [];
              }
              core.setOutput(
                "targets",
                JSON.stringify(
                  targets.map((target) => ({
                    pr_number: target.prNumber,
                    head_sha: target.headSha,
                    decision_key: target.decisionKey,
                  })),
                ),
              );
              const aggregateHeads =
                typeof autoGate.resolveAggregateHeads === "function"
                  ? autoGate.resolveAggregateHeads({ context, targets })
                  : [...new Set(targets.map((target) => target.headSha))];
              core.setOutput(
                "aggregate_heads",
                JSON.stringify(aggregateHeads.map((headSha) => ({ head_sha: headSha }))),
              );
              // Automated recovery can become unnecessary while it waits. Its
              // resolver has already validated the input and PR eligibility.
              if (context.eventName === "workflow_dispatch" && targets.length === 0 && !payload.inputs?.previous_head_sha) {
                const failure = new Error("No pull-request head was resolved for manual recovery.");
                failure.failWorkflow = true;
                throw failure;
              }
            } catch (error) {
              const message = error && error.message ? error.message : String(error);
              const summary = `BLOCKED: auto-gate evaluation error: ${message}`;
              const readFailure = autoGate?.isReadFailure?.(error) === true;
              core.warning(readFailure ? message : error && error.stack ? error.stack : message);
              core.notice(summary);
              core.setOutput("targets", "[]");
              core.setOutput(
                "aggregate_heads",
                JSON.stringify(
                  knownEventHeads.map((headSha) => ({
                    head_sha: headSha,
                    read_failure: readFailure ? summary : "",
                  })),
                ),
              );
              // A retry-exhausted read is a could-not-evaluate, not a defect:
              // downstream marks each known head's fixed aggregate UNKNOWN, and
              // fails its own job if it cannot (#4461). Failing this job too
              // would paint the run the same red as a real gate failure, while
              // rethrowing would discard the heads the lane still has to mark.
              //
              // That only holds when there IS a head to mark. A
              // workflow_dispatch or schedule payload names none, so nothing
              // downstream runs, nothing is published, and a green run here
              // would be the only record of a recovery that did nothing. That
              // exit stays red.
              if (readFailure && knownEventHeads.length === 0) {
                core.setFailed(summary);
                return;
              }
              if (readFailure) {
                core.warning(`Auto Gate could not evaluate: ${message}`);
                try {
                  await core.summary
                    ?.addRaw(
                      `## Auto Gate could not evaluate\n\n${summary}\n\n` +
                        "No verdict was computed for the affected heads. Downstream jobs mark " +
                        "each head's fixed aggregate UNKNOWN (a failing, non-mergeable " +
                        "conclusion), and fail if they cannot leave it non-passing.",
                    )
                    .write();
                } catch {
                  // The job summary is best-effort; the warning above carries the cause.
                }
                return;
              }
              throw error;
            }

      # A keep decided inside a merge is correct when it is made and nothing ever
      # revisits it, so the branch leaks the moment the reason for the keep goes
      # away — #3847 was retargeted 89 seconds after its base merged (#3852).
      #
      # Here rather than in apply-gate: this job runs once for every subscribed
      # event, including the runs where nothing merges, while apply-gate is a
      # matrix over aggregate heads that does not run at all when none was
      # invalidated and would sweep once per head when it does.
      - name: Sweep kept head branches
        id: sweep
        # always(), because a gate run whose evaluation failed still has branches
        # to prune and pruning them cannot make that evaluation any worse — and
        # AUTO_GATE_ENABLED, because deleting a ref is the gate writing to this
        # repository on its own, which is the thing that switch turns off. With
        # it off nothing merges, so nothing new leaks either.
        # Reconciliation passes, scheduled or dispatched, exist only to reconcile
        # required checks. Do not spend their deliberately bounded API budget on
        # unrelated branch housekeeping.
        if: always() && vars.AUTO_GATE_ENABLED == 'true' && github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            if (!fs.existsSync(helperPath)) {
              return;
            }
            const autoGate = require(helperPath);
            // The workflow file takes effect before its default-branch helper on
            // the landing run, exactly as the evaluate step above allows for.
            if (typeof autoGate.sweepMergedHeadRefs !== "function") {
              core.info("auto-gate helper on the default branch has no head-ref sweep yet.");
              return;
            }
            try {
              await autoGate.sweepMergedHeadRefs({ github, context, core });
            } catch (error) {
              // Pruning is housekeeping. Auto Gate red is this repo's highest-
              // priority alarm and has to keep meaning "a merge decision went
              // wrong"; a branch left on origin is visible in the next run's
              // notice and costs nothing until then.
              core.warning(
                `Head-ref sweep failed: ${error && error.message ? error.message : error}`,
              );
            }

      # Liveness for frozen decisions (#4571). The helper sends one
      # repository_dispatch per five-minute window, and that run is a full
      # scheduled pass. A pass never requests another: this condition skips both
      # pass events, and the helper refuses them too. always() is not used
      # because a cancelled run should not request a pass. A failed evaluation
      # above should still request one, since the pass does not depend on it.
      - name: Request stale-decision reconciliation
        if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'repository_dispatch' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            if (!fs.existsSync(helperPath)) {
              return;
            }
            const autoGate = require(helperPath);
            // The workflow file takes effect before its default-branch helper on
            // the landing run, exactly as the evaluate step above allows for.
            if (typeof autoGate.requestRequiredCheckReconciliation !== "function") {
              core.info("auto-gate helper on the default branch cannot request reconciliation yet.");
              return;
            }
            try {
              await autoGate.requestRequiredCheckReconciliation({ github, context, core });
            } catch (error) {
              // A missed request leaves the schedule as the backstop. Auto Gate
              // red has to keep meaning "a merge decision went wrong".
              core.warning(
                `Reconciliation request failed: ${error && error.message ? error.message : error}`,
              );
            }

  invalidate-gate:
    name: Invalidate aggregate
    needs: auto-gate
    outputs:
      invalidated_heads: ${{ steps.invalidate.outputs.invalidated_heads }}
    if: >-
      always() &&
      needs.auto-gate.outputs.aggregate_heads != '' &&
      needs.auto-gate.outputs.aggregate_heads != '[]'
    runs-on: ubuntu-latest
    # These writes deliberately happen before the per-head serialized lanes. A
    # newer event must turn each required check red while an older transaction
    # is still running; generation fencing prevents that older run from
    # overwriting it. A failed invalidation is retried before any serialized lane
    # wait; only heads with a confirmed newer generation enter that lane, while one
    # old-head failure cannot suppress a healthy current head.
    steps:
      - name: Check out gate logic
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Make the aggregate non-green immediately
        id: invalidate
        uses: actions/github-script@v8
        env:
          AGGREGATE_HEADS: ${{ needs.auto-gate.outputs.aggregate_heads }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require("path");
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/auto-gate.js");
            const autoGate = require(helperPath);
            const aggregateHeads = JSON.parse(process.env.AGGREGATE_HEADS || "[]");
            if (typeof autoGate.invalidateAggregateDecision !== "function") {
              core.notice("Landing compatibility: fixed aggregate invalidation starts on master.");
              core.setOutput("invalidated_heads", JSON.stringify(aggregateHeads));
              return;
            }
            const invalidateAggregate = async (aggregate) => {
              const headSha = String(aggregate.head_sha || "");
              const invalidated = await autoGate.invalidateAggregateDecision({
                github,
                context,
                core,
                headSha,
              });
              if (invalidated.writeState === "read-only") {
                throw new Error(`Could not invalidate aggregate ${headSha}.`);
              }
            };
            const invalidatedHeads = [];
            const failures = [];
            const deferredHeads = [];
            for (const aggregate of aggregateHeads) {
              const headSha = String(aggregate.head_sha || "");
              try {
                await invalidateAggregate(aggregate);
              } catch (initialError) {
                core.warning(
                  `Initial invalidation failed for ${headSha}; retrying before the serialized lane: ${initialError.message || String(initialError)}`,
                );
                try {
                  await invalidateAggregate(aggregate);
                } catch (retryError) {
                  const couldNotEvaluate =
                    autoGate.isReadFailure?.(retryError) === true ||
                    autoGate.isRateLimitFailure?.(retryError) === true;
                  if (couldNotEvaluate) {
                    // A rate-limited or exhausted-transport invalidation is
                    // infrastructure, not a verdict: keep the head in the lane
                    // so the serialized transaction retries the invalidation
                    // itself — and publishes UNKNOWN if the quota is still
                    // gone — instead of this job going the same red as a real
                    // gate failure (#4461). If the lane cannot write either,
                    // no replacement exists and the lane's job fails instead.
                    deferredHeads.push({ headSha, error: retryError });
                    invalidatedHeads.push(aggregate);
                    core.warning(
                      `Could not invalidate aggregate ${headSha} after the pre-lane retry ` +
                        `(${retryError.message || String(retryError)}); the serialized lane ` +
                        "will retry it, publish UNKNOWN if evaluation still cannot run, and fail " +
                        "if it cannot write either.",
                    );
                    continue;
                  }
                  failures.push(
                    new AggregateError(
                      [initialError, retryError],
                      `Could not invalidate aggregate ${headSha} before the serialized lane`,
                    ),
                  );
                  core.warning(
                    `Could not invalidate aggregate ${headSha} after the pre-lane retry: ${retryError.message || String(retryError)}`,
                  );
                  continue;
                }
              }
              invalidatedHeads.push(aggregate);
            }
            core.setOutput("invalidated_heads", JSON.stringify(invalidatedHeads));
            if (deferredHeads.length > 0) {
              core.notice(
                `${deferredHeads.length} aggregate invalidation(s) deferred to the serialized lane ` +
                  "because GitHub API calls were rate-limited or exhausted.",
              );
            }
            if (failures.length > 0) {
              throw new AggregateError(
                failures,
                `${failures.length} aggregate invalidation(s) failed after the pre-lane retry`,
              );
            }

  apply-gate:
    name: Apply aggregate gate
    needs: [auto-gate, invalidate-gate]
    # Keep always() so successfully fenced heads proceed even if another candidate
    # exhausts its pre-lane retry. An unfenced head is deliberately absent: it must
    # not wait behind an older transaction that can still publish PASS.
    if: >-
      always() &&
      needs.invalidate-gate.outputs.invalidated_heads != '' &&
      needs.invalidate-gate.outputs.invalidated_heads != '[]'
    strategy:
      fail-fast: false
      matrix:
        aggregate: ${{ fromJSON(needs.invalidate-gate.outputs.invalidated_heads) }}
    # Invalidation has already run for EVERY event, outside both lanes. Keep
    # each head separate so a comment cannot replace synchronize's previous head.
    # github.event.action is reached only by a repository_dispatch pass. Every
    # other subscribed event stops at an earlier field.
    concurrency:
      group: auto-gate-target-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.event.sha || github.event.schedule || github.event.action || github.run_id }}-head-${{ matrix.aggregate.head_sha }}
      cancel-in-progress: false
    uses: ./.github/workflows/auto-gate-aggregate.yml
    with:
      head_sha: ${{ matrix.aggregate.head_sha }}
      targets_json: ${{ needs.auto-gate.outputs.targets || '[]' }}
      read_failure: ${{ matrix.aggregate.read_failure || '' }}
