name: Close fixed issues

# Closes the issues a merged PR lists after Fixes/Closes/Resolves (lists and
# ranges included), which GitHub's own linking only half does. Merges made by the
# auto-merger use GITHUB_TOKEN and fire no pull_request event, so the merger runs
# the same script itself (.github/scripts/close-fixed-issues.js); this workflow
# covers merges made by a person or a PAT.

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close fixed issues
    # A stacked PR merges into another PR's branch; only the default branch counts.
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      # The script comes from master, never from the PR head.
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Close issues listed after a closing keyword
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            await require('./.github/scripts/close-fixed-issues.js').run({ github, core, context });
