name: Closing keyword lint

# GitHub closes only the FIRST issue after a closing keyword ("Fixes #1, #2, #3"
# leaves #2 and #3 open) and ignores ranges. This warns, on the PR, when a title
# or body does that, and names the exact fix ("Fixes #1, fixes #2"), which
# GitHub's own parser handles — including for the auto-merger's GITHUB_TOKEN
# merges. Advisory only: it never fails, so it is not a required check and a
# false positive costs a warning.
#
# pull_request_target so a fork PR can run it too; that is safe because the job
# holds a read-only token, checks out MASTER (never the PR), and reads the PR only
# as event-payload text passed through env, never interpolated into a script.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Closing keyword lint
    # Pinned to 24.04 until #6281 (26.04 compatibility) lands.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Warn on a keyword followed by several issue numbers
        uses: actions/github-script@v8
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            await require('./.github/scripts/closing-keyword-lint.js').run({ core });
