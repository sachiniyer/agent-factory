site_name: Agent Factory
site_description: >-
  Terminal UI for running many AI coding agents — Claude Code, Codex, Aider,
  Gemini, Amp, opencode, and Devin — each in its own isolated git worktree.
site_url: https://sachiniyer.github.io/agent-factory/
repo_url: https://github.com/sachiniyer/agent-factory
repo_name: sachiniyer/agent-factory
edit_uri: edit/master/docs/
copyright: Agent Factory is licensed under the GNU AGPL v3.

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    # Auto (respects the OS): the icon toggles light <-> dark. The accent
    # palette and its verified contrast-safe derivatives are defined as
    # semantic tokens in docs/stylesheets/extra.css, so both schemes use custom.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sachiniyer/agent-factory
      name: Agent Factory on GitHub

plugins:
  - search
  # Every page this reorganisation moved keeps its old URL as a redirect stub,
  # so links already out in the world — README badges, `af --help`, issue
  # comments, release notes — still land on the page rather than a 404 (#3855).
  # Add an entry here whenever a page moves; never delete one.
  - redirects:
      redirect_maps:
        how-it-works.md: concepts.md
        concepts/worktree-agents.md: sessions.md
        concepts/tui.md: tui.md
        concepts/daemon.md: daemon.md
        container-testing.md: dev/container-testing.md
        lifecycle-testing.md: dev/lifecycle-testing.md
        web-selftest.md: dev/web-selftest.md
        tui-manual-testing.md: dev/tui-manual-testing.md
        surface-parity.md: dev/surface-parity.md
        file-length-lint.md: dev/file-length-lint.md
        release-process.md: dev/release-process.md
        release-testing-plan.md: dev/release-testing-plan.md
        release-notes.md: dev/release-notes.md
        daemon-memory.md: dev/daemon-memory.md
        demo-assets.md: dev/demo-assets.md

# Fail the build on broken in-repo links and on `#fragment` targets that no
# heading produces, but don't choke on links that intentionally point outside
# docs/ (e.g. ../.github/…). `mkdocs build --strict` turns the warnings below
# into errors.
#
# `anchors` was `ignore` until #2623, on the theory that cross-page anchors
# would be too noisy to gate on. Measured on the real tree instead of assumed:
# the whole site produced exactly one warning, and it was a genuine dead link
# (#2621 had just fixed five more of the same class, none of which this build
# had ever complained about).
# If some future link really is unfixable, name it here rather than switching
# the whole class back off.
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: ignore
  unrecognized_links: ignore
  anchors: warn

nav:
  - Home: index.md
  - Use:
      - Getting started: getting-started.md
      - Concepts: concepts.md
      - Sessions and worktrees: sessions.md
      - The daemon: daemon.md
      - Web client: web.md
      - TUI: tui.md
      - CLI: cli.md
      - Tasks: tasks.md
      - Accounts and usage limits: usage-limits.md
      - Backends and remote access:
          - Backends: backends.md
          - Remote daemon access: remote-http-auth.md
          - Remote hooks: remote-hooks.md
      - Configuration: configuration.md
      - Agent plugins: agent-plugins.md
      - Troubleshooting: troubleshooting.md
      - Reference:
          - CLI reference: reference/cli.md
          - HTTP API guide: http-api.md
          - HTTP API reference: reference/api.md
      - Background:
          - Why Agent Factory: why-agent-factory.md
          - Use cases: use-cases.md
          - Comparison: comparison.md
  - Develop and maintain:
      - Overview: dev/index.md
      - Container testing: dev/container-testing.md
      - Demo assets: dev/demo-assets.md
      - Lifecycle testing: dev/lifecycle-testing.md
      - Web client selftest: dev/web-selftest.md
      - Manual TUI testing: dev/tui-manual-testing.md
      - Surface parity: dev/surface-parity.md
      - File-length lint: dev/file-length-lint.md
      - Release process: dev/release-process.md
      - Release testing plan: dev/release-testing-plan.md
      - Release notes: dev/release-notes.md
      - Daemon memory: dev/daemon-memory.md
      - Design notes:
          - TUI rewrite: design/tui-rewrite.md
          - Agent handoff: design/agent-handoff.md
